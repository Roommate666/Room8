<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1"><title>Coupon-Design</title><style>
*{box-sizing:border-box;margin:0;font-family:-apple-system,'Segoe UI',Inter,sans-serif}
:root{--mint:#21D0A1;--mint6:#12B489;--ink:#0E0E10;--mut:#8b8f96;--line:#ecedf0}
body{background:#fff;color:var(--ink)}.serif{font-family:'Georgia',serif}
.wrap{max-width:460px;margin:0 auto}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.act{display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:.7rem .3rem;border:1.5px solid var(--line);border-radius:16px;background:#fff;text-decoration:none;color:var(--ink);font-size:.72rem;font-weight:700}
.act .ic{width:34px;height:34px;border-radius:11px;background:var(--mint);color:#04231a;display:grid;place-items:center;font-size:1.05rem}

.p{padding:1.4rem 1.3rem}.hero{height:180px;border-radius:20px;background:linear-gradient(135deg,var(--mint),#7fe6cf);position:relative;margin-bottom:1rem}.hero .b{position:absolute;right:16px;top:16px;background:#0E0E10;color:#fff;font-weight:800;padding:.4rem .8rem;border-radius:12px;font-size:1.2rem}.sep{height:1px;background:var(--line);margin:1.1rem 0}</style></head><body><div class="wrap p"><p style="color:var(--mut);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.72rem">Face Off Arena · Neu-Ulm</p><h1 class=serif style="font-size:2.1rem;line-height:1.1;margin:.4rem 0 1rem">18 € + Freigetränk</h1><div class=hero><div class=b>18 €</div></div><div class=acts>
<a class=act href="tel:+49 731 1234567"><span class=ic>📞</span>Anrufen</a>
<a class=act href="https://www.google.com/maps/search/?api=1&query=Lessingstra%C3%9Fe%2010c%2C%20Neu-Ulm" target=_blank><span class=ic>📍</span>Karte</a>
