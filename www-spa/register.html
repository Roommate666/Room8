<!DOCTYPE html>
<html lang="de" data-page="register">
<head>
    <script src="sentry-init.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Registrieren - UniGoat</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico?v133">
    <link rel="privacy-policy" href="datenschutz.html">
    <link rel="terms-of-service" href="nutzungsbedingungen.html">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v133">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v133">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v133">
  <link rel="stylesheet" href="unigoat-v2.css">
  <style>
    /* Alias: altes Token-Vokabular auf v2 mappen, damit bestehendes JS +
       inline-styles (var(--primary-color) etc.) in v2-Farben weiterlaufen. */
    :root{
      --ink:var(--color-text); --paper:var(--color-bg); --card:var(--color-surface);
      --w2:var(--color-neutral-300); --w4:var(--text-muted); --line:var(--color-divider);
      --green:var(--color-accent); --greenD:var(--accent-small); --greenL:var(--color-accent-100);
      --fh:var(--font-heading); --fb:var(--font-body);
      --primary-color:var(--color-accent); --text-light:var(--text-muted);
    }
    main{ padding-bottom:24px; }

    /* Poster-Kopf: der eine Mint-Moment */
    .reg-poster{ background:var(--color-accent); color:var(--on-accent); padding:22px 20px 20px; }
    .reg-poster .reg-logo{ width:64px; height:64px; margin-bottom:12px; }
    .reg-poster .reg-logo img{ width:100%; height:100%; object-fit:contain; display:block; }
    .reg-poster h2{ font-family:var(--font-heading); font-weight:800; font-size:30px; line-height:1.05; letter-spacing:-.03em; margin:0; }
    .reg-poster p{ margin:10px 0 0; font-size:14px; line-height:1.5; max-width:34ch; }

    /* Formular-Bereich */
    .reg-body{ padding:18px 20px 0; }
    .reg-body .field{ margin-bottom:14px; }
    .reg-body .field small{ display:block; color:var(--text-muted); font-size:12px; margin-top:6px; }

    /* Consent-Zeilen (eckig, v2) */
    .consent{ display:flex; align-items:flex-start; gap:12px; border:1px solid var(--color-divider); background:var(--color-surface); padding:14px; cursor:pointer; font-weight:normal; font-size:14px; color:var(--color-text); line-height:1.5; margin-bottom:14px; }
    .consent input[type="checkbox"]{ width:20px; height:20px; margin-top:1px; accent-color:var(--color-accent); cursor:pointer; flex-shrink:0; border-radius:0; }
    .consent a{ color:var(--accent-small); text-decoration:underline; font-weight:600; }

    /* Nachricht */
    #msg{ margin-top:14px; text-align:left; font-weight:600; padding:14px; font-size:14px; line-height:1.5; }
    #msg:empty{ display:none; }
    #msg.success{ background:var(--color-accent-100); color:var(--color-accent-800); border:1px solid var(--color-accent); }
    #msg.error{ background:#FBEAE6; color:#C43A22; border:1px solid #E3A99B; }
    #msg a{ color:var(--accent-small); font-weight:800; text-decoration:underline; }

    .info-box{ background:var(--color-accent-100); border:1px solid var(--color-accent); padding:16px; margin-top:14px; font-size:14px; color:var(--color-text); line-height:1.6; }

    /* Social Login */
    .social-divider{ display:flex; align-items:center; gap:14px; margin:20px 0; }
    .social-divider::before, .social-divider::after{ content:''; flex:1; height:1px; background:var(--color-divider); }
    .social-divider span{ font-family:var(--font-heading); font-weight:800; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); white-space:nowrap; }
    .social-buttons{ display:flex; flex-direction:column; gap:10px; }
    .social-btn{ display:flex; align-items:center; justify-content:center; gap:12px; width:100%; padding:14px 16px; font-family:var(--font-heading); font-size:15px; font-weight:800; border:1px solid var(--color-text); background:var(--color-surface); color:var(--color-text); cursor:pointer; border-radius:0; min-height:54px; }
    .social-btn:active{ transform:translateY(1px); }
    .social-btn:hover{ background:color-mix(in srgb,var(--color-text) 7%,transparent); }
    .social-btn svg{ width:20px; height:20px; flex-shrink:0; }
    .social-btn.apple-btn{ background:var(--color-text); color:var(--color-bg); border-color:var(--color-text); }
    .social-btn.apple-btn:hover{ background:color-mix(in srgb,var(--color-text) 88%,transparent); }

    .login-link{ text-align:center; margin-top:20px; padding:16px; color:var(--text-muted); border-top:var(--rule); font-size:14px; }
    .login-link a{ color:var(--accent-small); text-decoration:none; font-weight:800; }
    .login-link a:hover{ text-decoration:underline; }
  </style>
</head>
<body>
<script>try{var _r=new URLSearchParams(location.search).get("ref");if(_r)localStorage.setItem("ug_ref",_r.trim().toUpperCase());}catch(e){}</script>

  <div class="screen app-container">
    <div class="screen-body">
      <div class="topbar" style="padding-top:14px">
        <a class="btn btn-icon back-arrow" href="index.html" aria-label="Zurück"><svg viewBox="0 0 24 24" style="width:22px;height:22px;stroke:var(--color-text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M15 18l-6-6 6-6"/></svg></a>
        <div class="masthead" style="font-size:30px;padding:0 8px 0 2px" data-i18n="nav_register">Registrieren</div>
        <span style="width:40px"></span>
      </div>
      <div class="hr"></div>

      <main class="app-content">
        <section class="reg-poster">
          <div class="reg-logo"><img src="logo-goat.png?v90" alt="UniGoat Logo"></div>
          <div class="kicker" style="color:var(--on-accent);opacity:.9" data-i18n="register_subtitle">Erstelle dein Konto und sichere dir Studentenrabatte, Jobs und Events</div>
          <h2 data-i18n="register_join">Tritt UniGoat bei</h2>
        </section>

        <div class="reg-body">
          <form id="registerForm">
            <div class="form-group field">
              <label for="username" data-i18n="auth_username">Benutzername</label>
              <input
                class="input"
                type="text"
                id="username"
                name="username"
                required
                minlength="3"
                autocomplete="username"
                data-i18n-placeholder="register_username_placeholder"
                placeholder="Wähle einen Benutzernamen"
              >
            </div>

            <div class="form-group field">
              <label for="email" data-i18n="register_email_label">E-Mail-Adresse</label>
              <input
                class="input"
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email"
                data-i18n-placeholder="register_email_placeholder"
                placeholder="deine.email@beispiel.de"
              >
              <small data-i18n="register_email_hint">
                Du kannst jede E-Mail-Adresse verwenden
              </small>
            </div>

            <div class="form-group field">
              <label for="password" data-i18n="register_password_label">Passwort (min. 6 Zeichen)</label>
              <input
                class="input"
                type="password"
                id="password"
                name="password"
                required
                minlength="6"
                autocomplete="new-password"
                data-i18n-placeholder="register_password_placeholder"
                placeholder="Wähle ein starkes Passwort"
              >
            </div>

            <div class="form-group">
              <label class="checkbox-container consent">
                <input
                  type="checkbox"
                  id="acceptTerms"
                  name="acceptTerms"
                  required
                >
                <span>
                  <span data-i18n="register_terms_agree">Ich akzeptiere die</span>
                  <a href="nutzungsbedingungen.html" target="_blank" data-i18n="register_terms_link">Nutzungsbedingungen (AGB)</a>
                  <span data-i18n="register_terms_and">und die</span>
                  <a href="datenschutz.html" target="_blank" data-i18n="register_privacy_link">Datenschutzerklärung</a>
                </span>
              </label>
            </div>

            <div class="form-group">
              <label class="checkbox-container consent">
                <input
                  type="checkbox"
                  id="emailOptIn"
                  name="emailOptIn"
                  checked
                >
                <span>Schick mir E-Mails zu Rabatten, Wettkampf und Neuigkeiten. (Jederzeit abbestellbar.)</span>
              </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block register-btn" id="registerBtn" data-i18n="register_btn_create">
              Konto erstellen
            </button>

            <p id="msg"></p>
          </form>

          <!-- Social Login -->
          <div class="social-divider"><span data-i18n="register_or_direct">oder direkt mit</span></div>

          <div class="social-buttons">
            <button type="button" class="social-btn google-btn" id="googleRegBtn">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
              </svg>
              Mit Google registrieren
            </button>

            <button type="button" class="social-btn apple-btn" id="appleRegBtn">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
              </svg>
              Mit Apple registrieren
            </button>
          </div>

          <div class="login-link">
            <span data-i18n="auth_have_account">Bereits ein Konto?</span> <a href="login.html" data-i18n="auth_login_link">Anmelden</a>
          </div>
        </div>
      </main>
    </div>

    <footer class="app-footer-nav" id="app-footer-nav"></footer>
  </div>

  <script src="lib/supabase.min.js"></script>
  <script src="config.js"></script>
<script src="session-cache.js"></script>
  <script>
    // Supabase Client - Direkte Initialisierung
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    var form = document.getElementById('registerForm');
    var msg = document.getElementById('msg');
    var registerBtn = document.getElementById('registerBtn');

    function setMsg(text, isSuccess) {
      msg.textContent = text;
      msg.className = isSuccess ? 'success' : 'error';
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      var username = document.getElementById('username').value.trim();
      var email = document.getElementById('email').value.trim().toLowerCase();
      var password = document.getElementById('password').value;

      var lang = localStorage.getItem('room8_language') || 'en';
      var messages = {
        de: {
          mismatch: 'Passwörter stimmen nicht überein!',
          short: 'Passwort muss mindestens 6 Zeichen haben!',
          terms: 'Bitte akzeptiere die Nutzungsbedingungen und Datenschutzerklärung.',
          creating: 'Konto wird erstellt...',
          success: 'Konto erstellt! Bitte überprüfe deine E-Mail.',
          already: 'Du hast bereits ein Konto mit dieser E-Mail! Bitte einfach einloggen.',
          invalid: 'Bitte gib eine gültige E-Mail-Adresse ein.',
          failed: 'Registrierung fehlgeschlagen: ',
          checkEmail: 'Überprüfe deine E-Mail!',
          sentTo: 'Wir haben einen Bestätigungslink an',
          clickLink: 'gesendet. Klicke auf den Link um dein Konto zu aktivieren.',
          spamHint: 'Mail nicht im Posteingang? Schau im Spam- oder Junk-Ordner nach und markiere sie als "Kein Spam".'
        },
        en: {
          mismatch: 'Passwords do not match!',
          short: 'Password must be at least 6 characters!',
          terms: 'Please accept the Terms of Use and Privacy Policy.',
          creating: 'Creating account...',
          success: 'Account created! Please check your email to confirm your address.',
          already: 'You already have an account with this email! Just log in.',
          invalid: 'Please enter a valid email address.',
          failed: 'Registration failed: ',
          checkEmail: 'Check your email!',
          sentTo: 'We sent a confirmation link to',
          clickLink: 'Click the link to activate your account.',
          spamHint: 'No mail in your inbox? Check your spam or junk folder and mark it as "Not Spam".'
        }
      };
      var m = messages[lang] || messages.de;

      var acceptTerms = document.getElementById('acceptTerms').checked;
      if (!acceptTerms) {
        setMsg(m.terms, false);
        return;
      }

      if (password.length < 6) {
        setMsg(m.short, false);
        return;
      }

      registerBtn.disabled = true;
      setMsg(m.creating, true);

      // E-Mail-Opt-in merken -> wird nach Verifizierung (complete-profile) angewendet
      try {
        var _opt = document.getElementById('emailOptIn');
        localStorage.setItem('ug_email_marketing', (_opt && !_opt.checked) ? '0' : '1');
      } catch(e) {}

      sb.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            username: username
          }
        }
      })
      .then(async function(response) {
        if (response.error) {
          throw response.error;
        }

        // Supabase gibt bei bereits existierender Email ein User-Objekt
        // mit leerer identities-Liste zurueck statt einem Fehler
        var user = response.data && response.data.user;
        if (user && user.identities && user.identities.length === 0) {
          throw { message: 'already registered', _alreadyExists: true };
        }

        registerBtn.disabled = true;

        // DIREKT-LOGIN: Wenn "Confirm email" im Supabase AUS ist, liefert signUp sofort eine Session.
        // Sonst aktiv einloggen versuchen (klappt sobald der Toggle aus ist). -> nur EINE Verifizierung
        // (die Studenten-Verifizierung kommt spaeter), keine separate Privat-Mail-Bestaetigung.
        var session = response.data && response.data.session;
        if (!session) {
          try {
            var si = await sb.auth.signInWithPassword({ email: email, password: password });
            if (si && si.data && si.data.session) session = si.data.session;
          } catch (e) { /* E-Mail-Bestaetigung evtl. noch aktiv -> Fallback unten */ }
        }
        if (session) {
          setMsg(m.success, true);
          window.location.href = 'app.html';
          return;
        }

        // FALLBACK: "Confirm email" ist noch aktiv -> alte "Check deine Mail"-Ansicht
        setMsg(m.success, true);
        form.reset();
        var infoBox = document.createElement('div');
        infoBox.className = 'info-box';
        var strong1 = document.createElement('strong');
        strong1.textContent = m.checkEmail;
        var strong2 = document.createElement('strong');
        strong2.textContent = email;
        infoBox.appendChild(strong1);
        infoBox.appendChild(document.createElement('br'));
        infoBox.appendChild(document.createTextNode(m.sentTo + ' '));
        infoBox.appendChild(strong2);
        infoBox.appendChild(document.createElement('br'));
        infoBox.appendChild(document.createTextNode(m.clickLink));

        // Spam-Hinweis (junge Domain → Mails landen oft initial in Junk)
        var spamHintBox = document.createElement('div');
        spamHintBox.style.cssText = 'margin-top:0.75rem;padding:0.75rem;background:#FEF3C7;border-left:3px solid #21D0A1;border-radius:6px;font-size:0.9rem;color:#78350F;';
        spamHintBox.textContent = m.spamHint;
        infoBox.appendChild(spamHintBox);

        msg.after(infoBox);
      })
      .catch(function(error) {
        console.error('Registration error:', error);

        var isAlready = (error._alreadyExists) ||
          (error.message && error.message.indexOf('already registered') !== -1);

        if (isAlready) {
          msg.textContent = '';
          msg.className = 'error';
          msg.appendChild(document.createTextNode(m.already + ' '));
          var loginLink = document.createElement('a');
          loginLink.href = 'login.html';
          loginLink.textContent = lang === 'de' ? 'Zum Login' : 'Go to Login';
          loginLink.style.cssText = 'color:#12B489;font-weight:700;text-decoration:underline;';
          msg.appendChild(loginLink);
        } else if (error.message && error.message.indexOf('Invalid email') !== -1) {
          setMsg(m.invalid, false);
        } else if (error.message && /password/i.test(error.message)) {
          setMsg(lang === 'de' ? 'Dein Passwort ist zu schwach — nimm mindestens 6 Zeichen.' : 'Your password is too weak — use at least 6 characters.', false);
        } else if (error.message && /rate limit|too many/i.test(error.message)) {
          setMsg(lang === 'de' ? 'Zu viele Versuche. Bitte warte kurz und versuch es erneut.' : 'Too many attempts. Please wait a moment and try again.', false);
        } else {
          setMsg(lang === 'de' ? 'Da ist leider was schiefgelaufen. Versuch es nochmal — wenn es weiter klemmt, melde dich beim UniGoat-Team unter info@unigoat.de.' : 'Something went wrong. Please try again — if it persists, contact the UniGoat team at info@unigoat.de.', false);
        }

        registerBtn.disabled = false;
      });
    });
  </script>
  <script src="social-auth.js"></script>
  <script>
    // Social Login: nutzt nativen Capacitor-Flow (Apple+Google) oder Web-OAuth-Fallback
    document.getElementById('googleRegBtn').addEventListener('click', async function() {
      var btn = this;
      try {
        btn.disabled = true; btn.style.opacity = '0.7';
        await window.signInWithGoogle();
      } catch(err) {
        console.error('Google Register Error:', err);
        var c=(err&&err.message||'').toLowerCase();
        if (!/cancel|abbruch|dismiss|closed/.test(c) && window.Room8UI) Room8UI.error('Die Google-Anmeldung hat nicht geklappt. Versuch es nochmal — oder melde dich beim UniGoat-Team unter info@unigoat.de.');
        btn.disabled = false; btn.style.opacity = '1';
      }
    });

    document.getElementById('appleRegBtn').addEventListener('click', async function() {
      var btn = this;
      try {
        btn.disabled = true; btn.style.opacity = '0.7';
        await window.signInWithApple();
      } catch(err) {
        console.error('Apple Register Error:', err);
        var c=(err&&err.message||'').toLowerCase();
        if (!/cancel|abbruch|dismiss|closed|1001/.test(c) && window.Room8UI) Room8UI.error('Die Apple-Anmeldung hat nicht geklappt. Versuch es nochmal — oder melde dich beim UniGoat-Team unter info@unigoat.de.');
        btn.disabled = false; btn.style.opacity = '1';
      }
    });
  </script>

  <script src="translations.js"></script>
  <script>
    // Fix back-arrow for Capacitor iOS
    document.querySelectorAll('.back-arrow, a[href="index.html"]').forEach(function(arrow) {
      arrow.addEventListener('click', function(e) {
        e.preventDefault();
        var href = arrow.getAttribute('href');
        if (href && href !== '#') {
          try {
            window.location.href = href;
          } catch(err) {
            window.location.replace(href);
          }
        } else {
          window.history.back();
        }
      });
    });
  </script>
</body>
</html>
