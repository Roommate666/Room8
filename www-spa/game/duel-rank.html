<!DOCTYPE html>
<html lang="de" data-page="duel-rank">
<head>
<script src="../sentry-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duell-Rangliste — UniGoat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A1613; --paper:#F7F4EE; --card:#FFFFFF; --w4:#9C9284; --line:#E7DFD2;
    --mint:#12B489; --mint2:#21D0A1; --mint-d:#0E9673; --mintL:#E4FBF3; --gold:#F4B740;
    --grad:linear-gradient(180deg,#21D0A1,#12B489); --sh:0 1px 2px rgba(40,30,15,.05),0 14px 34px rgba(40,30,15,.09); --sh-mint:0 10px 22px rgba(18,180,137,.32);
    --fh:'Fraunces',serif; --fb:'Sora',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:var(--fb);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(24px + env(safe-area-inset-bottom));}
  h1,h2,h3{font-family:var(--fh);font-weight:700;}
  .back{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;color:var(--ink);cursor:pointer;z-index:5;box-shadow:var(--sh);text-decoration:none;}
  .head{text-align:center;margin:18px 0 20px;}
  .head h1{font-size:28px;}
  .head .sub{color:var(--w4);font-weight:600;font-size:13.5px;margin-top:4px;}

  /* eigene Bilanz-Karte */
  .mecard{background:linear-gradient(158deg,#20242a,#141416);color:#fff;border-radius:22px;padding:20px;margin-bottom:20px;box-shadow:0 18px 40px rgba(20,20,22,.28);position:relative;overflow:hidden;}
  .mecard .glow{position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(33,208,161,.4),transparent 70%);}
  .mecard .lbl{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--mint2);position:relative;}
  .mecard .elo{font-family:var(--fh);font-size:52px;font-weight:700;line-height:1;margin:6px 0 2px;position:relative;}
  .mecard .elo small{font-size:16px;color:rgba(255,255,255,.6);font-weight:600;}
  .mecard .rec{display:flex;gap:20px;margin-top:14px;position:relative;}
  .mecard .rec div{font-size:12px;color:rgba(255,255,255,.7);font-weight:600;}
  .mecard .rec b{font-family:var(--fh);font-size:22px;color:#fff;display:block;font-weight:700;}
  .mecard .myrank{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 13px;font-weight:800;font-size:13px;}

  .sect{font-family:var(--fh);font-size:17px;font-weight:700;margin:2px 2px 10px;}
  .row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh);}
  .row.me{border-color:var(--mint);background:var(--mintL);}
  .row .r{width:28px;font-family:var(--fh);font-weight:700;font-size:16px;color:var(--w4);flex-shrink:0;}
  .row .r.top{color:var(--gold);}
  .row .n{flex:1;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .wl{font-size:11.5px;color:var(--w4);font-weight:600;}
  .row .e{font-family:var(--fh);font-weight:700;font-size:18px;color:var(--mint-d);}
  .empty{text-align:center;color:var(--w4);font-weight:600;font-size:13.5px;padding:2rem 1rem;line-height:1.6;}
  .cta{display:block;text-align:center;text-decoration:none;background:var(--grad);color:#fff;font-weight:800;font-size:15px;padding:15px;border-radius:16px;box-shadow:var(--sh-mint);margin-top:18px;}
</style>
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png?v133">
</head>
<body>
<a class="back" href="duel.html">‹</a>
<div class="wrap">
  <div class="head">
    <h1>🏆 Duell-Rangliste</h1>
    <div class="sub">Gewinne Duelle, steig im ELO — die Besten oben.</div>
  </div>

  <div class="mecard">
    <span class="glow"></span>
    <span class="myrank" id="myRank">–</span>
    <div class="lbl">Dein ELO</div>
    <div class="elo"><span id="myElo">1000</span> <small>Punkte</small></div>
    <div class="rec">
      <div>Siege<b id="myWins">0</b></div>
      <div>Niederlagen<b id="myLosses">0</b></div>
    </div>
  </div>

  <div class="sect">Top-Spieler</div>
  <div id="list"><div class="empty">Lade Rangliste…</div></div>

  <a class="cta" href="duel.html">⚔️ Zum Duell</a>
</div>

<script src="../lib/supabase.min.js"></script>
<script src="../config.js"></script>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var sb=window.sb, MYID=null;

  async function load(){
    if(!sb){ $('list').innerHTML='<div class="empty">Verbindungsfehler.</div>'; return; }
    try{ var u=await sb.auth.getUser(); MYID=u&&u.data&&u.data.user?u.data.user.id:null; }catch(e){}
    if(!MYID){ location.href='../login.html'; return; }
    // eigene Bilanz
    try{ var mr=await sb.from('pvp_rating').select('elo,wins,losses').eq('user_id',MYID).maybeSingle();
      if(mr.data){ $('myElo').textContent=mr.data.elo; $('myWins').textContent=mr.data.wins; $('myLosses').textContent=mr.data.losses; } }catch(e){}
    // Rangliste
    var rows=[];
    try{ var r=await sb.from('pvp_leaderboard').select('user_id,elo,wins,losses,username').order('elo',{ascending:false}).limit(50); rows=r.data||[]; }catch(e){}
    if(!rows.length){ $('list').innerHTML='<div class="empty">Noch keine Duelle gespielt.<br>Sei der Erste — fordere einen Freund heraus! 🐐</div>'; return; }
    // eigenen Rang finden
    var myIdx=rows.findIndex(function(x){return x.user_id===MYID;});
    if(myIdx>=0) $('myRank').textContent='Platz '+(myIdx+1);
    $('list').innerHTML=rows.map(function(x,i){
      var mine=x.user_id===MYID, rk=i+1;
      return '<div class="row'+(mine?' me':'')+'">'+
        '<div class="r'+(rk<=3?' top':'')+'">'+(rk<=3?['🥇','🥈','🥉'][rk-1]:rk)+'</div>'+
        '<div class="n">'+(mine?'Du · ':'')+esc(x.username||'Anonym')+'<div class="wl">'+x.wins+' S / '+x.losses+' N</div></div>'+
        '<div class="e">'+x.elo+'</div>'+
      '</div>';
    }).join('');
  }
  load();
})();
</script>
</body>
</html>
