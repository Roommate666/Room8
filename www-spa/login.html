<!DOCTYPE html>
<html lang="de" data-page="login">
<head>
    <script src="sentry-init.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Anmelden - UniGoat</title>
  <link rel="stylesheet" href="unigoat-v2.css">
  <style>
    /* Alias: altes Token-Vokabular -> v2, damit inline-styles + JS weiterlaufen */
    :root{
      --ink:var(--color-text); --paper:var(--color-bg); --card:var(--color-surface);
      --w2:var(--color-neutral-300); --w4:var(--text-muted); --line:var(--color-divider);
      --green:var(--color-accent); --greenD:var(--accent-small); --greenL:var(--color-accent-100);
      --fh:var(--font-heading); --fb:var(--font-body);
    }

    .icn{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

    /* Poster-Hero (der eine Mint-Moment) */
    .login-poster{ background:var(--color-accent); color:var(--on-accent); padding:26px 20px 22px; text-align:center; }
    .login-poster .login-logo{ width:88px; height:88px; margin:0 auto 12px; }
    .login-poster .login-logo img{ width:100%; height:100%; object-fit:contain; display:block; }
    .login-poster h1{ font-family:var(--font-heading); font-weight:800; font-size:28px; line-height:1.05; letter-spacing:-.02em; margin:0; color:var(--on-accent); }
    .login-poster p{ margin:8px 0 0; font-size:14px; line-height:1.5; opacity:.92; }

    /* Formular-Bereich */
    .login-main{ padding:18px 20px 24px; }
    .field{ margin-bottom:14px; }
    .forgot-password-link{
      display:block; text-align:right; margin-top:8px; font-size:13px;
      color:var(--accent-small); text-decoration:none; font-weight:800;
    }
    .forgot-password-link:hover{ text-decoration:underline; }

    .stay-row{ display:flex; align-items:center; gap:.6rem; margin-top:14px; font-size:14px; color:var(--color-text); cursor:pointer; }
    .stay-row input{ width:20px; height:20px; accent-color:var(--color-accent); cursor:pointer; flex-shrink:0; }

    /* Social Login */
    .social-divider{ display:flex; align-items:center; gap:1rem; margin:20px 0; }
    .social-divider::before, .social-divider::after{ content:''; flex:1; height:1px; background:var(--color-divider); }
    .social-divider span{ font-size:12px; color:var(--text-muted); white-space:nowrap; text-transform:uppercase; letter-spacing:.06em; font-family:var(--font-heading); font-weight:800; }
    .social-buttons{ display:flex; flex-direction:column; gap:10px; }
    .social-btn{
      display:flex; align-items:center; justify-content:center; gap:.75rem;
      width:100%; min-height:52px; padding:14px 16px; border-radius:0;
      font-size:15px; font-weight:800; font-family:var(--font-heading);
      border:2px solid var(--color-text); background:var(--color-surface);
      color:var(--color-text); cursor:pointer;
      transition:background .15s, opacity .15s;
    }
    .social-btn:active{ transform:scale(0.99); }
    .social-btn svg{ width:20px; height:20px; flex-shrink:0; }
    .social-btn.google-btn:hover{ background:color-mix(in srgb, var(--color-text) 6%, transparent); }
    .social-btn.apple-btn{ background:var(--color-text); color:var(--color-bg); border-color:var(--color-text); }
    .social-btn.apple-btn:hover{ background:color-mix(in srgb, var(--color-text) 85%, transparent); }

    .register-hint{
      text-align:center; margin-top:20px; padding:16px;
      font-size:14px; color:var(--text-muted);
      border:2px solid var(--color-divider);
    }
    .register-hint a{ color:var(--accent-small); font-weight:800; text-decoration:none; }
    .register-hint a:hover{ text-decoration:underline; }

    .legal-links{ margin-top:22px; text-align:center; font-size:12px; color:var(--text-muted); }
    .legal-links a{ color:var(--text-muted); text-decoration:underline; }
  </style>
<link rel="icon" type="image/x-icon" href="favicon.ico?v133"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v133"><link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v133"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v133">
</head>
<body>
<script>try{var _r=new URLSearchParams(location.search).get("ref");if(_r)localStorage.setItem("ug_ref",_r.trim().toUpperCase());}catch(e){}</script>

  <div class="screen app-container">
    <div class="screen-body">
      <div class="topbar" style="padding-top:14px">
        <a href="index.html" class="btn btn-icon backbtn back-arrow" aria-label="Zurück">
          <svg class="icn" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </a>
        <div class="masthead" style="font-size:34px;padding:0 8px 0 2px" data-i18n="login_title">Anmelden</div>
        <span style="width:40px"></span>
      </div>
      <div class="hr"></div>

      <section class="login-poster">
        <div class="login-logo">
          <img src="logo-goat.png?v90" alt="UniGoat Logo">
        </div>
        <h1 data-i18n="auth_login_title">Willkommen zurück!</h1>
        <p data-i18n="login_subtitle">Logge dich ein, um fortzufahren.</p>
      </section>

      <main class="app-content login-main">

        <form id="loginForm">
          <div class="field form-group">
            <label for="loginEmail" data-i18n="auth_email">E-Mail Adresse</label>
            <input class="input" type="email" id="loginEmail" required data-i18n-placeholder="auth_email_placeholder" placeholder="deine@email.de" autocomplete="email">
          </div>

          <div class="field form-group">
            <label for="loginPassword" data-i18n="auth_password">Passwort</label>
            <input class="input" type="password" id="loginPassword" required data-i18n-placeholder="auth_password_placeholder" placeholder="••••••••" autocomplete="current-password">
            <a href="forgot-password.html" class="forgot-password-link" data-i18n="login_forgot">Passwort vergessen?</a>
          </div>

          <label class="stay-row">
            <input type="checkbox" id="stayLoggedIn" checked>
            <span>Angemeldet bleiben</span>
          </label>

          <button type="submit" class="btn btn-primary btn-block submit-btn" id="loginBtn" style="margin-top:1.25rem;justify-content:center;" data-i18n="auth_btn_login">Einloggen</button>
        </form>

        <!-- Social Login -->
        <div class="social-divider"><span data-i18n="login_or_with">oder direkt mit</span></div>
        <div class="social-buttons">
          <button type="button" class="social-btn google-btn" id="googleLoginBtn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Mit Google anmelden
          </button>
          <button type="button" class="social-btn apple-btn" id="appleLoginBtn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
              <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
            </svg>
            Mit Apple anmelden
          </button>
        </div>

        <div class="register-hint">
          <span data-i18n="auth_no_account">Noch kein Konto?</span> <a href="register.html" data-i18n="auth_signup_link">Jetzt registrieren</a>
        </div>

        <div class="legal-links">
          <a href="datenschutz.html">Datenschutz</a>
          &nbsp;·&nbsp;
          <a href="nutzungsbedingungen.html">Nutzungsbedingungen</a>
          &nbsp;·&nbsp;
          <a href="impressum.html">Impressum</a>
        </div>
      </main>

      <footer class="app-footer-nav" id="app-footer-nav"></footer>
    </div>
  </div>

  <script src="lib/supabase.min.js"></script>
  <script src="config.js"></script>
<script src="session-cache.js"></script>
  <script src="room8-ui.js"></script>
  <script>
    // Supabase Client - Direkte Initialisierung
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    var loginBtn = document.getElementById('loginBtn');

    // Saved-Login: zuletzt genutzte E-Mail vorausfuellen
    try { var _se=localStorage.getItem('ug_saved_email'); if(_se){ var _el=document.getElementById('loginEmail'); if(_el&&!_el.value){ _el.value=_se; document.getElementById('loginPassword')&&document.getElementById('loginPassword').focus(); } } } catch(e){}

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      var T = function(k, fb){ return (window.Room8i18n && Room8i18n.t) ? Room8i18n.t(k) : fb; };
      if(!sb) {
          Room8UI.error(T('login_connection_error', 'Verbindungsfehler. Bitte später erneut versuchen.'));
          return;
      }

      var email = document.getElementById('loginEmail').value.trim();
      var password = document.getElementById('loginPassword').value;

      loginBtn.disabled = true;
      var originalText = loginBtn.textContent;
      loginBtn.textContent = T('login_loading', 'Wird eingeloggt...');

      sb.auth.signInWithPassword({ email: email, password: password })
        .then(async function(response) {
          if (response.error) {
            throw response.error;
          }
          // Saved-Login: E-Mail merken (Session bleibt eh via persistSession erhalten)
          try { localStorage.setItem('ug_saved_email', email); } catch(e) {}
          // "Angemeldet bleiben": steuert Auto-Weiterleitung beim naechsten App-Start (intro.html)
          try {
            var _stay = document.getElementById('stayLoggedIn');
            localStorage.setItem('ug_persist', (_stay && !_stay.checked) ? '0' : '1');
          } catch(e) {}
          // Nach Login direkt in die App-Shell (app.html)
          window.location.href = 'app.html';
        })
        .catch(function(err) {
          console.error("Login Error:", err);
          var raw = (err && err.message) ? err.message : '';
          var msg;
          if (/invalid login credentials/i.test(raw)) msg = 'E-Mail oder Passwort ist falsch.';
          else if (/email not confirmed/i.test(raw)) msg = 'Bitte bestätige zuerst deine E-Mail — der Link ist in deinem Postfach (auch im Spam schauen).';
          else if (/rate limit|too many/i.test(raw)) msg = 'Zu viele Versuche. Warte kurz und versuch es dann nochmal.';
          else if (/network|fetch|connection/i.test(raw)) msg = 'Keine Verbindung. Prüfe dein Internet und versuch es nochmal.';
          else msg = 'Da ist leider was schiefgelaufen. Versuch es nochmal — wenn es weiter klemmt, melde dich beim UniGoat-Team unter info@unigoat.de.';
          Room8UI.error(msg);
          loginBtn.disabled = false;
          loginBtn.textContent = originalText;
        });
    });
  </script>

  <script src="social-auth.js"></script>
  <script>
    // Social Login: Google + Apple (nativ in Capacitor, Web-OAuth-Fallback im Browser)
    document.getElementById('googleLoginBtn').addEventListener('click', async function() {
      var btn = this;
      try {
        btn.disabled = true; btn.style.opacity = '0.7';
        await window.signInWithGoogle();
      } catch(err) {
        console.error('Google Login Error:', err);
        var c=(err&&err.message||'').toLowerCase();
        if (!/cancel|abbruch|dismiss|closed/.test(c) && window.Room8UI) Room8UI.error('Die Google-Anmeldung hat nicht geklappt. Versuch es nochmal — oder melde dich beim UniGoat-Team unter info@unigoat.de.');
        btn.disabled = false; btn.style.opacity = '1';
      }
    });
    document.getElementById('appleLoginBtn').addEventListener('click', async function() {
      var btn = this;
      try {
        btn.disabled = true; btn.style.opacity = '0.7';
        await window.signInWithApple();
      } catch(err) {
        console.error('Apple Login Error:', err);
        var c=(err&&err.message||'').toLowerCase();
        if (!/cancel|abbruch|dismiss|closed|1001/.test(c) && window.Room8UI) Room8UI.error('Die Apple-Anmeldung hat nicht geklappt. Versuch es nochmal — oder melde dich beim UniGoat-Team unter info@unigoat.de.');
        btn.disabled = false; btn.style.opacity = '1';
      }
    });
  </script>

  <script src="translations.js"></script>
  <script>
    // In der nativen App ist Login der Einstieg -> kein vorheriger Schritt -> Zurueck-Pfeil ausblenden
    var isNativeApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
    if (isNativeApp) {
      document.querySelectorAll('.back-arrow, a[href="index.html"]').forEach(function(a){ a.style.display = 'none'; });
    }
    // Fix back-arrow for Capacitor iOS (nur Web: fuehrt zur Landing)
    document.querySelectorAll('.back-arrow, a[href="index.html"]').forEach(function(arrow) {
      arrow.addEventListener('click', function(e) {
        e.preventDefault();
        var href = arrow.getAttribute('href');
        if (href && href !== '#') {
          try {
            window.location.href = href;
          } catch(err) {
            window.location.replace(href);
          }
        } else {
          window.history.back();
        }
      });
    });
  </script>
<script src="cookie-consent.js"></script>
</body>
</html>
