<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Coupon — UniGoat</title>
<style>
  :root{--mint:#21D0A1;--mint6:#12B489;--mint-pill:#E7F8F1;--ink:#0E0E10;--mut:#8b8f96;--line:#ecedf0;--dark:#141416;}
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;}
  body{background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;padding-bottom:7rem;}
  .serif{font-family:'Georgia','Times New Roman',serif;}
  .wrap{max-width:480px;margin:0 auto;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.1rem;position:sticky;top:0;z-index:20;}
  .rnd{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;font-size:1.1rem;box-shadow:0 2px 8px rgba(0,0,0,.08);}
  /* HERO / Galerie */
  .hero{position:relative;height:260px;background:var(--dark);}
  .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none;}
  .gal::-webkit-scrollbar{display:none;}
  .gal img{min-width:100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;display:block;}
  .dots{position:absolute;left:0;right:0;bottom:56px;display:flex;gap:6px;justify-content:center;}
  .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);}
  .dots i.on{background:#fff;width:18px;border-radius:3px;}
  .status{position:absolute;left:14px;top:14px;display:inline-flex;align-items:center;gap:.4rem;background:rgba(20,20,22,.72);backdrop-filter:blur(6px);color:#fff;font-weight:700;font-size:.78rem;padding:.4rem .7rem;border-radius:999px;}
  .status .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px rgba(33,208,161,.25);}
  .status.closed .dot{background:#ff5a5a;box-shadow:0 0 0 3px rgba(255,90,90,.25);}
  .badge{position:absolute;left:14px;bottom:14px;background:var(--mint);color:#04231a;font-weight:800;font-size:1.6rem;padding:.45rem .85rem;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.25);}
  .brand{position:absolute;right:14px;bottom:14px;width:52px;height:52px;border-radius:14px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.2);overflow:hidden;display:grid;place-items:center;font-weight:800;color:var(--ink);}
  .brand img{width:100%;height:100%;object-fit:cover;}
  /* Action-Karte (schwebend, A) */
  .actcard{margin:-30px 1.1rem 0;position:relative;z-index:5;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 14px 34px rgba(0,0,0,.08);padding:.8rem;display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:.5rem;}
  .act{display:flex;flex-direction:column;align-items:center;gap:.35rem;text-decoration:none;color:var(--ink);font-size:.72rem;font-weight:700;}
  .act .ic{width:40px;height:40px;border-radius:13px;background:var(--mint);display:grid;place-items:center;}
  .act .ic svg{width:20px;height:20px;stroke:#04231a;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .act .ic.ig{background:linear-gradient(45deg,#f9ce34,#ee2a7b 45%,#6228d7);}
  .act .ic.ig svg{stroke:#fff;}
  /* Body (B: editorial) */
  .p{padding:1.2rem 1.2rem 0;}
  .biz{color:var(--mut);font-weight:700;letter-spacing:.03em;text-transform:uppercase;font-size:.72rem;}
  h1{font-size:1.9rem;line-height:1.12;margin:.4rem 0 .8rem;letter-spacing:-.01em;}
  .desc{color:#3d4148;line-height:1.6;font-size:.98rem;}
  .coin{display:flex;align-items:center;gap:.55rem;background:var(--mint-pill);border:1px solid #cdeee0;border-radius:14px;padding:.8rem .9rem;color:var(--mint6);font-weight:700;margin:1.1rem 0;}
  .coin .g{width:24px;height:24px;border-radius:50%;background:var(--mint);color:#04231a;display:grid;place-items:center;font-weight:800;font-size:.8rem;flex:0 0 24px;}
  .hoursrow{display:flex;gap:.75rem;align-items:flex-start;border-top:1px solid var(--line);padding:1rem 0;color:#3d4148;}
  .hoursrow .ic{width:34px;height:34px;border-radius:10px;background:#f5f6f8;display:grid;place-items:center;flex:0 0 34px;}
  .hoursrow small{color:var(--mut);white-space:pre-line;}
  /* CTA */
  .cta{position:fixed;left:0;right:0;bottom:0;padding:.9rem 1.1rem calc(.9rem + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,255,255,0),#fff 34%);}
  .cta .inner{max-width:480px;margin:0 auto;}
  .btn{width:100%;padding:1.05rem;border:none;border-radius:16px;background:var(--mint);color:#04231a;font-size:1.05rem;font-weight:800;cursor:pointer;box-shadow:0 10px 26px rgba(33,208,161,.38);}
  .btn:active{transform:scale(.99);}
  .btn.gray{background:#e9eaed;color:#8a8f96;box-shadow:none;}
  .valid{text-align:center;color:var(--mut);font-size:.8rem;margin-top:.6rem;}
  /* Sheets */
  .ov{position:fixed;inset:0;z-index:60;background:rgba(14,14,16,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;align-items:flex-end;}
  .ov.open{display:flex;}
  .sheet{background:#fff;border-radius:26px 26px 0 0;width:100%;max-width:480px;margin:0 auto;padding:1.6rem 1.3rem calc(1.6rem + env(safe-area-inset-bottom));text-align:center;animation:up .25s ease;}
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet h2{font-size:1.4rem;margin:.2rem 0 .4rem;}
  .sheet p{color:var(--mut);line-height:1.5;margin-bottom:1.1rem;}
  .warn{background:#fff6 e6;background:#FFF7E6;color:#8a5a00;border-radius:12px;padding:.7rem;font-size:.85rem;font-weight:600;margin-bottom:1rem;}
  .bigcode{border:2px dashed #bfe0cd;border-radius:16px;background:var(--mint-pill);padding:1.1rem;margin:1rem 0;}
  .bigcode small{display:block;color:var(--mint6);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;}
  .bigcode b{font-size:2rem;letter-spacing:.14em;color:var(--mint6);}
  .succ-ico{width:72px;height:72px;border-radius:20px;background:var(--mint);display:grid;place-items:center;margin:0 auto .7rem;color:#04231a;font-size:2.2rem;}
  .ghost{width:100%;padding:.9rem;border:none;border-radius:14px;background:#f0f1f3;font-weight:700;cursor:pointer;margin-top:.5rem;}
  .showcard{background:var(--dark);color:#fff;border-radius:18px;padding:1.3rem;margin:.6rem 0 1rem;}
  .showcard .d{font-size:2.4rem;font-weight:800;color:var(--mint);}
</style>
<script src="lib/supabase.min.js"></script>
<script src="config.js"></script>
</head>
<body>
<div class="topbar">
  <div class="rnd" onclick="history.length>1?history.back():location.href='coupons.html'">‹</div>
  <div class="rnd" title="Speichern">♡</div>
</div>
<div class="wrap">
  <div class="hero">
    <div class="gal" id="gal"></div>
    <div class="dots" id="dots"></div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">…</span></div>
    <div class="badge serif" id="badge">–</div>
    <div class="brand" id="brand"></div>
  </div>
  <div class="actcard" id="actcard"></div>
  <div class="p">
    <div class="biz" id="biz">Lade…</div>
    <h1 class="serif" id="title"></h1>
    <p class="desc" id="desc"></p>
    <div class="coin"><span class="g">G</span><span>+50 Goat-Coins, sobald du einlöst</span></div>
    <div class="hoursrow" id="hoursRow" style="display:none;">
      <div class="ic">🕒</div>
      <div><b>Öffnungszeiten</b><br><small id="hoursText"></small></div>
    </div>
  </div>
</div>
<div class="cta"><div class="inner">
  <button class="btn" id="redeemBtn" onclick="step1()">Jetzt einlösen</button>
  <div class="valid">Gültig bis <span id="validDate">–</span></div>
</div></div>

<!-- 2-Schritt-Einloesen -->
<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<script>
(function(){
  "use strict";
  var params=new URLSearchParams(location.search); var id=params.get('id');
  var coupon=null,userId=null,already=false;
  var $=function(x){return document.getElementById(x);};
  function fmtDate(d){if(!d)return '—';try{return new Date(d).toLocaleDateString('de-DE');}catch(e){return d;}}
  function bucketUrl(path){try{return sb.storage.from('listing-images').getPublicUrl(path).data.publicUrl;}catch(e){return null;}}
  function svg(p){return '<svg viewBox="0 0 24 24">'+p+'</svg>';}
  var IC={
    call:svg('<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>'),
    map:svg('<path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>'),
    ig:svg('<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff" stroke="none"/>'),
    web:svg('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/>')
  };
  function parseClose(oh){ if(!oh)return null; var m=oh.match(/(\d{1,2}[:.]\d{2})(?!.*\d{1,2}[:.]\d{2})/); return m?m[1].replace('.',':'):null; }

  async function init(){
    if(!window.sb||!id){$('biz').textContent='Coupon nicht ladbar';return;}
    try{var u=await sb.auth.getUser();userId=u&&u.data&&u.data.user?u.data.user.id:null;}catch(e){}
    var r=await sb.from('coupons').select('*, coupon_photos(storage_path,photo_type,display_order)').eq('id',id).single();
    if(r.error||!r.data){$('biz').textContent='Coupon nicht gefunden';return;}
    coupon=r.data;render();
    if(userId){try{var red=await sb.from('coupon_redemptions').select('id').eq('coupon_id',id).eq('user_id',userId).maybeSingle();if(red.data&&coupon.usage_limit_per_user===1){already=true;markDone();}}catch(e){}}
  }
  function render(){
    document.title=(coupon.title||'Coupon')+' — UniGoat';
    $('biz').textContent=(coupon.business_name||'')+(coupon.city?(' · '+coupon.city):'');
    $('title').textContent=coupon.title||'';
    $('desc').textContent=coupon.description||'';
    var dv=(coupon.discount_value||'').toString().trim(); if(/^\d+$/.test(dv))dv=dv+'%';
    $('badge').textContent=dv||'–';
    $('validDate').textContent=fmtDate(coupon.valid_until);
    // Galerie: alle Fotos ausser logo
    var photos=(coupon.coupon_photos||[]).slice().sort(function(a,b){return (a.display_order||0)-(b.display_order||0);});
    var logo=photos.filter(function(p){return p.photo_type==='logo';})[0];
    var gal=photos.filter(function(p){return p.photo_type!=='logo';});
    if(!gal.length&&logo)gal=[logo];
    var g=$('gal'),d=$('dots');g.innerHTML='';d.innerHTML='';
    if(gal.length){gal.forEach(function(p,i){var im=document.createElement('img');im.src=bucketUrl(p.storage_path);im.loading='lazy';g.appendChild(im);var dot=document.createElement('i');if(i===0)dot.className='on';d.appendChild(dot);});}
    else {g.style.background='var(--dark)';}
    if(gal.length>1){g.addEventListener('scroll',function(){var i=Math.round(g.scrollLeft/g.clientWidth);[].forEach.call(d.children,function(el,k){el.className=k===i?'on':'';});});} else {d.style.display='none';}
    if(logo){$('brand').innerHTML='<img src="'+bucketUrl(logo.storage_path)+'">';}else{$('brand').textContent=(coupon.business_name||'?').trim().slice(0,2).toUpperCase();}
    // Status + Schliesszeit
    var close=parseClose(coupon.opening_hours);
    if(coupon.opening_hours){$('statusText').textContent=close?('Geöffnet · bis '+close):'Geöffnet';$('hoursRow').style.display='flex';$('hoursText').textContent=coupon.opening_hours;}
    else{$('status').style.display='none';}
    // Action-Buttons (nur vorhandene)
    var acts=[];
    if(coupon.phone)acts.push('<a class="act" href="tel:'+coupon.phone+'"><span class="ic">'+IC.call+'</span>Anrufen</a>');
    if(coupon.address)acts.push('<a class="act" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(coupon.address+' '+(coupon.city||''))+'" target="_blank"><span class="ic">'+IC.map+'</span>Karte</a>');
    if(coupon.instagram){var h=coupon.instagram.replace('@','').replace(/^https?:\/\/(www\.)?instagram\.com\//,'');acts.push('<a class="act" href="https://instagram.com/'+h+'" target="_blank"><span class="ic ig">'+IC.ig+'</span>Instagram</a>');}
    if(coupon.website){var w=coupon.website.match(/^https?:/)?coupon.website:('https://'+coupon.website);acts.push('<a class="act" href="'+w+'" target="_blank"><span class="ic">'+IC.web+'</span>Website</a>');}
    var ac=$('actcard');ac.style.setProperty('--n',acts.length||1);ac.innerHTML=acts.join('')||'<div style="color:var(--mut);font-size:.85rem;padding:.4rem;text-align:center;grid-column:1/-1">Keine Kontaktdaten</div>';
  }
  function markDone(){var b=$('redeemBtn');b.textContent='Bereits eingelöst ✓';b.classList.add('gray');b.onclick=null;}

  // ---- 2-Schritt-Einloesen ----
  function open(html){$('sheet').innerHTML=html;$('ov').classList.add('open');}
  window.closeSheet=function(){$('ov').classList.remove('open');};
  window.step1=function(){ // Sicherheitsabfrage
    if(already)return;
    open('<h2 class="serif">Coupon einlösen?</h2>'+
      '<p>Löse erst ein, wenn du <b>an der Kasse</b> stehst.</p>'+
      '<div class="warn">⚠️ '+(coupon.usage_limit_per_user===1?'Einmalig pro Konto — danach ist der Coupon verbraucht.':'Du zeigst den Coupon gleich der Kasse.')+'</div>'+
      '<button class="btn" onclick="step2()">Ja, an der Kasse einlösen</button>'+
      '<button class="ghost" onclick="closeSheet()">Abbrechen</button>');
  };
  window.step2=function(){ // Der Kasse zeigen
    var dv=(coupon.discount_value||'').toString();if(/^\d+$/.test(dv))dv=dv+'%';
    open('<h2 class="serif">Zeig das der Kasse</h2>'+
      '<p>Die Kasse bestätigt deinen Rabatt. Erst danach auf „Eingelöst" tippen.</p>'+
      '<div class="showcard"><div style="font-size:.8rem;opacity:.8">'+(coupon.business_name||'')+'</div><div class="d serif">'+dv+'</div><div style="font-size:.95rem">'+(coupon.title||'')+'</div></div>'+
      '<button class="btn" onclick="finish()">✓ Die Kasse hat bestätigt</button>'+
      '<button class="ghost" onclick="closeSheet()">Doch nicht</button>');
  };
  window.finish=async function(){ // Erfolg
    var code='UG'+Math.floor(1000+Math.random()*8999);
    try{ if(userId){ await sb.from('coupon_redemptions').insert({coupon_id:coupon.id,user_id:userId,verification_code:code,redeemed_at:new Date().toISOString()}); } }catch(e){}
    open('<div class="succ-ico">✓</div><h2 class="serif" style="color:var(--mint6)">Erfolgreich eingelöst!</h2>'+
      '<p>Zeig der Kasse zur Sicherheit diesen Screen.</p>'+
      '<div class="bigcode"><small>Bestätigungs-Code</small><b>'+code+'</b></div>'+
      '<button class="btn" onclick="closeSheet();'+(coupon.usage_limit_per_user===1?'location.reload()':'')+'">Fertig</button>');
    if(coupon.usage_limit_per_user===1){already=true;}
  };
  init();
})();
</script>
</body>
</html>
