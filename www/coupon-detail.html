<!DOCTYPE html>
<html lang="de">
<head>
<script src="sentry-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Coupon — UniGoat</title>
<link rel="stylesheet" href="unigoat-v2.css">
<style>
  /* Alias: altes Token-Vokabular auf v2 mappen, damit bestehendes JS + inline-styles
     in v2-Farben weiterlaufen. */
  :root{
    --ink:var(--color-text); --paper:var(--color-bg); --card:var(--color-surface);
    --w2:var(--color-neutral-300); --w4:var(--text-muted); --line:var(--color-divider);
    --green:var(--color-accent); --greenD:var(--accent-small); --greenL:var(--color-accent-100);
    --fh:var(--font-heading); --fb:var(--font-body);
    /* Alt-Aliasse dieser Seite (JS/inline-styles nutzen diese Namen weiter) */
    --mint:var(--color-accent); --mint6:var(--accent-small); --mint-pill:var(--color-accent-100);
    --mut:var(--text-muted); --dark:var(--color-text);
  }
  *{-webkit-tap-highlight-color:transparent;}
  body{padding-bottom:7rem;}
  /* .serif war Fraunces -> v2 Archivo (Klasse bleibt, JS setzt sie per innerHTML) */
  .serif{font-family:var(--font-heading);font-weight:800;letter-spacing:-.02em;}
  .icn{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;}
  .wrap{max-width:480px;margin:0 auto;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(1.1rem + env(safe-area-inset-top)) var(--space-5) .9rem;position:sticky;top:0;z-index:20;}
  /* Back-Chrome: eckige v2-Icon-Buttons statt runder Glas-Kreise */
  .rnd{width:44px;height:44px;background:var(--color-bg);border:2px solid var(--color-text);display:grid;place-items:center;cursor:pointer;color:var(--color-text);}
  .rnd:active{background:color-mix(in srgb,var(--color-text) 12%,transparent);}
  .rnd.saved{color:var(--color-accent);border-color:var(--color-accent);background:var(--color-accent-100);}
  .rnd svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  /* HERO / Galerie (Coupon-Bild bleibt FARBIG) */
  .hero{position:relative;height:260px;background:var(--color-text);border-bottom:var(--rule);}
  .hero::after{content:'';position:absolute;top:0;left:0;right:0;height:100px;background:linear-gradient(180deg,rgba(0,0,0,.4),transparent);pointer-events:none;z-index:1;}
  .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none;}
  .gal::-webkit-scrollbar{display:none;}
  .gal img{min-width:100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;display:block;}
  .dots{position:absolute;left:0;right:0;bottom:56px;display:flex;gap:6px;justify-content:center;}
  .dots i{width:6px;height:6px;background:rgba(255,255,255,.5);}
  .dots i.on{background:#fff;width:18px;}
  .status{position:absolute;left:14px;top:14px;z-index:2;display:inline-flex;align-items:center;gap:.4rem;background:var(--color-text);color:var(--color-bg);font-family:var(--font-heading);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:.4rem .7rem;}
  .status .dot{width:8px;height:8px;background:var(--color-accent);}
  .status.closed .dot{background:#E5533C;}
  .badge{display:inline-block;background:var(--color-accent);color:var(--on-accent);font-family:var(--font-heading);font-weight:800;font-size:1.3rem;padding:.32rem .8rem;vertical-align:middle;letter-spacing:-.01em;}
  .brand{position:absolute;right:14px;bottom:14px;z-index:2;width:52px;height:52px;background:var(--color-bg);border:2px solid var(--color-text);overflow:hidden;display:grid;place-items:center;font-family:var(--font-heading);font-weight:800;color:var(--color-text);}
  .brand img{width:100%;height:100%;object-fit:cover;}
  /* Rabatt + Kategorie (unter dem Bild, NICHT aufs Bild) */
  .discrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 10px;}
  .vbadge{display:inline-flex;align-items:center;gap:5px;background:var(--color-accent-100);color:var(--color-accent-800);font-family:var(--font-heading);font-weight:800;font-size:11px;letter-spacing:.02em;padding:3px 10px;}
  .menubtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--color-text);color:var(--color-bg);border:none;padding:14px;font-family:var(--font-heading);font-weight:800;font-size:15px;margin-top:14px;cursor:pointer;}
  .menubtn:active{opacity:.88;}
  /* Menue-Overlay: horizontal swipebar */
  .menuov{position:fixed;inset:0;z-index:300;background:color-mix(in srgb,var(--color-text) 94%,transparent);display:none;flex-direction:column;}
  .menuov.open{display:flex;}
  .menuov .mhead{display:flex;justify-content:space-between;align-items:center;padding:16px;color:var(--color-bg);font-family:var(--font-heading);font-weight:800;font-size:1.05rem;}
  .menuov .mclose{background:none;border:none;color:var(--color-bg);font-size:2rem;line-height:1;cursor:pointer;}
  .menuov .mstrip{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
  .menuov .mstrip>.mslide{min-width:100%;scroll-snap-align:center;display:grid;place-items:center;padding:0 16px;box-sizing:border-box;}
  .menuov .mstrip img{max-width:100%;max-height:76vh;object-fit:contain;}
  .menuov .mtext{color:var(--color-bg);line-height:1.6;font-size:1rem;max-width:520px;}
  .menuov .mtext h3{color:var(--color-bg);margin:0 0 10px;font-family:var(--font-heading);font-weight:800;}
  .menuov .mdots{display:flex;gap:6px;justify-content:center;padding:16px;min-height:14px;}
  .menuov .mdots span{width:7px;height:7px;background:color-mix(in srgb,var(--color-bg) 35%,transparent);}
  .menuov .mdots span.on{background:var(--color-accent);}
  /* Action-Karte (schwebend, A) */
  .actcard{margin:-30px var(--space-5) 0;position:relative;z-index:5;background:var(--color-bg);border:2px solid var(--color-text);box-shadow:var(--shadow-md);padding:.8rem;display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:.5rem;}
  .act{display:flex;flex-direction:column;align-items:center;gap:.35rem;text-decoration:none;color:var(--color-text);font-family:var(--font-heading);font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;}
  .act .ic{width:40px;height:40px;background:var(--color-accent);display:grid;place-items:center;}
  .act .ic svg{width:20px;height:20px;stroke:var(--on-accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .act .ic.ig{background:var(--color-text);}
  .act .ic.ig svg{stroke:var(--color-bg);}
  /* Body (B: editorial) */
  .p{padding:1.2rem var(--space-5) 0;}
  .biz{color:var(--text-muted);font-family:var(--font-heading);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:11px;}
  h1{font-family:var(--font-heading);font-weight:800;font-size:32px;line-height:.98;margin:.4rem 0 .8rem;letter-spacing:-.03em;}
  .desc{color:var(--text-soft);line-height:1.6;font-size:15px;}
  .coin{display:flex;align-items:center;gap:.55rem;background:var(--color-accent-100);border:1px solid var(--color-accent-200);padding:.8rem .9rem;color:var(--color-accent-800);font-family:var(--font-heading);font-weight:800;margin:1.1rem 0;}
  .coin .g{width:24px;height:24px;background:var(--color-accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--font-heading);font-weight:800;font-size:.8rem;flex:0 0 24px;}
  .hoursrow{display:flex;gap:.75rem;align-items:flex-start;border-top:var(--rule-thin);padding:1rem 0;color:var(--color-text);}
  .hoursrow .ic{width:34px;height:34px;background:var(--color-surface);display:grid;place-items:center;flex:0 0 34px;}
  .hoursrow small{color:var(--text-muted);white-space:pre-line;}
  /* CTA */
  .cta{position:fixed;left:0;right:0;bottom:0;padding:.9rem var(--space-5) calc(.9rem + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--color-bg) 34%);}
  .cta .inner{max-width:480px;margin:0 auto;}
  .btn{width:100%;padding:1.05rem;border:none;background:var(--color-accent);color:var(--on-accent);font-family:var(--font-heading);font-size:16px;font-weight:800;cursor:pointer;letter-spacing:-.01em;}
  .btn:active{background:var(--color-accent-700);}
  .btn.gray{background:var(--color-surface);color:var(--text-muted);}
  .valid{text-align:center;color:var(--text-muted);font-size:.8rem;margin-top:.6rem;}
  /* Sheets */
  .ov{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--color-neutral-900) 50%,transparent);display:none;align-items:flex-end;}
  .ov.open{display:flex;}
  .sheet{background:var(--color-bg);width:100%;max-width:480px;margin:0 auto;padding:1.6rem var(--space-5) calc(1.6rem + env(safe-area-inset-bottom));text-align:center;box-shadow:var(--shadow-lg);animation:up .25s ease;}
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet h2{font-family:var(--font-heading);font-weight:800;font-size:1.5rem;margin:.2rem 0 .4rem;letter-spacing:-.02em;}
  .sheet p{color:var(--text-muted);line-height:1.5;margin-bottom:1.1rem;}
  .warn{background:var(--color-accent-100);color:var(--color-accent-800);padding:.7rem;font-family:var(--font-heading);font-size:.85rem;font-weight:800;margin-bottom:1rem;}
  .bigcode{border:2px dashed var(--color-accent);background:var(--color-accent-100);padding:1.1rem;margin:1rem 0;}
  .bigcode small{display:block;color:var(--accent-small);font-family:var(--font-heading);font-weight:800;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;}
  .bigcode b{font-family:var(--font-heading);font-size:2rem;letter-spacing:.14em;color:var(--accent-small);}
  .succ-ico{width:72px;height:72px;background:var(--color-accent);display:grid;place-items:center;margin:0 auto .7rem;color:var(--on-accent);font-family:var(--font-heading);font-weight:800;font-size:2.2rem;}
  /* ===== Feier-Moment nach dem Einloesen ===== */
  .checkwrap{width:88px;height:88px;margin:0 auto .5rem;position:relative;}
  .checkwrap::before{content:'';position:absolute;inset:-10px;background:radial-gradient(circle,color-mix(in srgb,var(--color-accent) 30%,transparent),transparent 68%);animation:glowpulse 1.2s ease-out;}
  .checkmark{width:88px;height:88px;position:relative;}
  .ck-ring{fill:none;stroke:var(--color-accent);stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151;animation:ringdraw .5s cubic-bezier(.65,0,.45,1) forwards;}
  .ck-tick{fill:none;stroke:var(--accent-small);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:tickdraw .32s .45s cubic-bezier(.65,0,.45,1) forwards;}
  @keyframes ringdraw{to{stroke-dashoffset:0}}
  @keyframes tickdraw{to{stroke-dashoffset:0}}
  @keyframes glowpulse{0%{transform:scale(.6);opacity:0}40%{opacity:1}100%{transform:scale(1.55);opacity:0}}
  .succ-h{font-family:var(--font-heading);font-weight:800;font-size:1.6rem;color:var(--color-text);margin:.1rem 0 .5rem;letter-spacing:-.02em;}
  .coinwin{display:inline-flex;align-items:center;gap:.5rem;background:var(--color-accent-100);border:1px solid var(--color-accent-200);padding:.5rem 1.1rem;margin-bottom:1rem;animation:cpop .45s .5s both;}
  .coinwin .ccoin{width:26px;height:26px;background:var(--color-accent);color:var(--on-accent);font-weight:800;display:grid;place-items:center;font-size:.82rem;font-family:var(--font-heading);}
  .coinwin .cnum{font-weight:800;font-size:1.35rem;color:var(--accent-small);font-family:var(--font-heading);font-feature-settings:'tnum' 1;}
  .coinwin .clbl{font-family:var(--font-heading);font-weight:800;color:var(--accent-small);font-size:.85rem;}
  @keyframes cpop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
  .stampbox{position:relative;border:2px dashed var(--color-accent);background:var(--color-accent-100);padding:1rem 1.1rem;margin:.3rem 0 1rem;animation:stampin .4s .7s both;}
  .stampbox .stamp-lbl{display:block;font-family:var(--font-heading);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);font-weight:800;}
  .stampbox .stamp-code{display:block;font-family:var(--font-heading);font-size:2rem;font-weight:800;letter-spacing:.14em;color:var(--accent-small);margin:.15rem 0;font-feature-settings:'tnum' 1;}
  .stampbox .stamp-ok{position:absolute;top:9px;right:10px;font-family:var(--font-heading);font-size:.6rem;font-weight:800;color:var(--accent-small);border:1.5px solid var(--color-accent);padding:2px 6px;transform:rotate(9deg);text-transform:uppercase;letter-spacing:.05em;}
  @keyframes stampin{0%{transform:scale(1.28) rotate(-2deg);opacity:0}70%{transform:scale(.97) rotate(.5deg)}100%{transform:scale(1) rotate(0);opacity:1}}
  .succ-p{color:var(--text-muted);font-size:.88rem;margin-bottom:1rem;}
  .confetti{position:fixed;top:32vh;width:9px;height:13px;z-index:100;pointer-events:none;opacity:.95;animation:confall 2s cubic-bezier(.3,.7,.4,1) forwards;}
  @keyframes confall{0%{transform:translateY(0) translateX(0) rotate(0);opacity:1}100%{transform:translateY(64vh) translateX(var(--dx)) rotate(var(--dr));opacity:0}}
  @media(prefers-reduced-motion:reduce){.ck-ring,.ck-tick,.coinwin,.stampbox,.confetti,.checkwrap::before{animation:none!important;}.ck-ring,.ck-tick{stroke-dashoffset:0;}}
  .ghost{width:100%;padding:.9rem;border:2px solid var(--color-text);background:transparent;font-family:var(--font-heading);font-weight:800;color:var(--color-text);cursor:pointer;margin-top:.5rem;}
  .ghost:active{background:color-mix(in srgb,var(--color-text) 12%,transparent);}
  /* Swipe-to-redeem (v2 .swipe: eckig, 2px-Rahmen, Tinte-Knopf) */
  .swipe{position:relative;height:64px;overflow:hidden;margin:.5rem 0 .3rem;user-select:none;touch-action:pan-y;
    background:var(--color-surface);border:2px solid var(--color-text);}
  .swipe .fill{position:absolute;inset:0;width:64px;transition:width .05s;background:var(--color-accent);}
  .swipe .lbl{position:absolute;inset:0;padding-left:58px;display:flex;align-items:center;justify-content:center;gap:.45rem;
    font-family:var(--font-heading);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);pointer-events:none;z-index:2;}
  .swipe .lbl .chev{display:inline-flex;color:var(--accent-small);animation:swhint 1.5s ease-in-out infinite;}
  .swipe .lbl .chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
  @keyframes swhint{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(5px)}}
  .swipe .knob{position:absolute;top:4px;left:4px;width:56px;height:56px;z-index:3;touch-action:none;
    display:grid;place-items:center;color:var(--color-bg);background:var(--color-text);}
  .swipe .knob svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
  .swipe.done .fill{width:100%!important;}
  .swipe.done .knob{color:var(--on-accent);background:var(--color-accent);animation:knobpop .4s ease;}
  @keyframes knobpop{0%{transform:scale(.82)}55%{transform:scale(1.16)}100%{transform:scale(1)}}
  /* Gutschein-Ticket im Einloesen-Sheet (v2 .ticket: Mint-Flaeche, Tinte drauf) */
  .ticket{position:relative;background:var(--color-bg);overflow:hidden;margin:.2rem 0 1rem;border:2px solid var(--color-text);}
  .ticket-top{padding:1.7rem 1.2rem 1.4rem;text-align:center;position:relative;color:var(--on-accent);
    background:var(--color-accent);}
  .ticket-biz{font-family:var(--font-heading);font-size:.74rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--on-accent);opacity:.85;position:relative;}
  .ticket-val{font-family:var(--font-heading);font-weight:800;font-size:3.4rem;line-height:1;color:var(--on-accent);margin:.28rem 0 .22rem;position:relative;letter-spacing:-.03em;}
  .ticket-title{font-family:var(--font-heading);font-weight:800;font-size:1rem;color:var(--on-accent);position:relative;}
  .ticket-valid{font-size:.74rem;color:var(--on-accent);opacity:.82;margin-top:.55rem;position:relative;}
  .ticket-perf{position:relative;height:0;border-top:2px dashed var(--color-divider);}
  .ticket-perf::before,.ticket-perf::after{content:'';position:absolute;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--color-bg);box-shadow:inset 0 0 0 2px var(--color-text);}
  .ticket-perf::before{left:-12px;}
  .ticket-perf::after{right:-12px;}
  .ticket-bottom{padding:1.2rem 1.1rem 1.3rem;background:var(--color-bg);}
  .ticket-hint{text-align:center;font-size:.78rem;color:var(--text-muted);margin-top:.7rem;}
  /* Fullscreen-Lightbox (Coupon-Bild bleibt FARBIG) */
  .lb{position:fixed;inset:0;z-index:80;background:#000;display:none;flex-direction:column;}
  .lb.open{display:flex;}
  .lb .close{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:3;width:44px;height:44px;background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.6);font-size:1.4rem;cursor:pointer;}
  .lb .strip{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;}
  .lb .strip::-webkit-scrollbar{display:none;}
  .lb .strip img{min-width:100vw;width:100vw;height:100%;object-fit:contain;scroll-snap-align:center;}
  .lb .cnt{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fff;font-family:var(--font-heading);font-weight:800;font-size:.9rem;z-index:3;text-shadow:0 1px 4px rgba(0,0,0,.6);}
</style>
<script src="lib/supabase.min.js"></script>
<script src="config.js"></script>
<link rel="icon" type="image/x-icon" href="favicon.ico?v133"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v133"><link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v133"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v133">
</head>
<body>
<div class="topbar">
  <div class="rnd" aria-label="Zurück" onclick="history.length>1?history.back():location.href='coupons.html'"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
  <div class="rnd" id="saveBtn" title="Speichern" onclick="toggleSave()">♡</div>
</div>
<div class="wrap">
  <div class="hero">
    <div class="gal" id="gal"></div>
    <div class="dots" id="dots"></div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">…</span></div>
    <div class="brand" id="brand"></div>
  </div>
  <div class="actcard" id="actcard"></div>
  <div class="p">
    <div class="discrow">
      <span class="badge serif" id="badge">–</span>
      <span class="vbadge" id="vbadge" style="display:none;"></span>
    </div>
    <div class="biz" id="biz">Lade…</div>
    <h1 class="serif" id="title"></h1>
    <p class="desc" id="desc"></p>
    <button class="menubtn" id="menuBtn" style="display:none;" onclick="openMenu()"><svg class="icn" viewBox="0 0 24 24" style="stroke:currentColor"><rect x="8" y="3" width="8" height="4" rx="0"/><path d="M8 5H5v16h14V5h-3M9 12h6M9 16h4"/></svg> Menü &amp; Angebot ansehen</button>
    <a class="menubtn" id="bookBtn" href="#" target="_blank" rel="noopener" style="display:none;text-decoration:none;"><svg class="icn" viewBox="0 0 24 24" style="stroke:currentColor"><rect x="3" y="4" width="18" height="18" rx="0"/><path d="M3 9h18M8 2v4M16 2v4"/></svg> Termin online buchen</a>
    <div id="bookHint" style="display:none;font-size:12px;color:var(--text-muted);margin-top:6px;line-height:1.4;">Den Rabatt bekommst du vor Ort — beim Termin einfach den QR-Code aus der App zeigen.</div>
    <div class="coin"><span class="g">G</span><span>+100 G-Coins, sobald du einlöst</span></div>
    <div class="hoursrow" id="hoursRow" style="display:none;">
      <div class="ic"><svg class="icn" viewBox="0 0 24 24" style="stroke:var(--color-text)"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
      <div><b>Öffnungszeiten</b><br><small id="hoursText"></small></div>
    </div>
  </div>
</div>
<div class="cta"><div class="inner">
  <button class="btn" id="redeemBtn" onclick="step1()">Jetzt einlösen</button>
  <div class="valid">Gültig bis <span id="validDate">–</span></div>
</div></div>

<!-- Einloesen (Sicherheitsabfrage + Swipe) -->
<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<!-- Fullscreen-Bildergalerie -->
<div class="lb" id="lb">
  <button class="close" onclick="closeLB()">&times;</button>
  <div class="strip" id="lbStrip"></div>
  <div class="cnt" id="lbCnt"></div>
</div>

<!-- Menue-/Angebots-Ansicht (swipebar) -->
<div class="menuov" id="menuOv" onclick="if(event.target===this)closeMenu()">
  <div class="mhead"><span id="menuTitle">Menü &amp; Angebot</span><button class="mclose" onclick="closeMenu()">&times;</button></div>
  <div class="mstrip" id="menuStrip"></div>
  <div class="mdots" id="menuDots"></div>
</div>

<script>
(function(){
  "use strict";
  var params=new URLSearchParams(location.search); var id=params.get('id');
  var coupon=null,userId=null,already=false,galUrls=[],menuSlides=[];
  var $=function(x){return document.getElementById(x);};
  function fmtDate(d){if(!d)return '—';try{return new Date(d).toLocaleDateString('de-DE');}catch(e){return d;}}
  function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function bucketUrl(path){try{return sb.storage.from('listing-images').getPublicUrl(path,{transform:{width:1000,height:1000,resize:'contain',quality:70}}).data.publicUrl;}catch(e){return null;}}
  function svg(p){return '<svg viewBox="0 0 24 24">'+p+'</svg>';}
  var IC={
    call:svg('<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>'),
    map:svg('<path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>'),
    ig:svg('<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff" stroke="none"/>'),
    web:svg('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/>')
  };
  function parseClose(oh){ if(!oh)return null; var m=oh.match(/(\d{1,2}[:.]\d{2})(?!.*\d{1,2}[:.]\d{2})/); return m?m[1].replace('.',':'):null; }
  // Live-Oeffnungsstatus: nutzt strukturierte hours-JSON ({mon:[["09:00","18:00"]],...}),
  // faellt sonst auf Freitext-opening_hours zurueck. Gibt {open, text, hasData} zurueck.
  var DAYKEYS=['sun','mon','tue','wed','thu','fri','sat'];
  var DAYLBL=['So','Mo','Di','Mi','Do','Fr','Sa'];
  function hm(s){var m=/^(\d{1,2}):(\d{2})$/.exec(String(s).trim());return m?(+m[1])*60+(+m[2]):null;}
  function computeStatus(){
    var h=coupon.hours;
    var valid=h&&typeof h==='object'&&DAYKEYS.some(function(k){return Array.isArray(h[k])&&h[k].length;});
    if(valid){
      var now=new Date(),dow=now.getDay(),nowMin=now.getHours()*60+now.getMinutes();
      var today=Array.isArray(h[DAYKEYS[dow]])?h[DAYKEYS[dow]]:[];
      for(var i=0;i<today.length;i++){var a=hm(today[i][0]),b=hm(today[i][1]);if(a!=null&&b!=null&&nowMin>=a&&nowMin<b){return {open:true,hasData:true,text:'Geöffnet · schließt '+today[i][1]};}}
      // heute spaeter?
      var nextToday=null;
      for(var j=0;j<today.length;j++){var aa=hm(today[j][0]);if(aa!=null&&aa>nowMin&&(nextToday==null||aa<nextToday)){nextToday=today[j][0];}}
      if(nextToday)return {open:false,hasData:true,text:'Geschlossen · öffnet '+nextToday};
      // naechster Tag mit Zeiten
      for(var d=1;d<=7;d++){var key=DAYKEYS[(dow+d)%7];var arr=Array.isArray(h[key])?h[key]:[];if(arr.length){return {open:false,hasData:true,text:'Geschlossen · öffnet '+DAYLBL[(dow+d)%7]+' '+arr[0][0]};}}
      return {open:false,hasData:true,text:'Geschlossen'};
    }
    // Fallback Freitext (nicht wirklich live -> weich als geoeffnet mit Schliesszeit)
    if(coupon.opening_hours){var c=parseClose(coupon.opening_hours);return {open:true,hasData:true,text:c?('Geöffnet · bis '+c):'Geöffnet'};}
    return {hasData:false};
  }
  function renderStatus(){
    var st=computeStatus();
    if(!st.hasData){$('status').style.display='none';return;}
    $('statusText').textContent=st.text;
    $('status').classList.toggle('closed',!st.open);
  }
  function weeklyText(){
    var h=coupon.hours;
    if(h&&typeof h==='object'){
      var lines=[];
      for(var d=1;d<=7;d++){var idx=d%7;var arr=Array.isArray(h[DAYKEYS[idx]])?h[DAYKEYS[idx]]:[];
        lines.push(DAYLBL[idx]+': '+(arr.length?arr.map(function(iv){return iv[0]+'–'+iv[1];}).join(', '):'geschlossen'));}
      return lines.join('\n');
    }
    return coupon.opening_hours||'';
  }

  async function init(){
    if(!window.sb||!id){$('biz').textContent='Coupon nicht ladbar';return;}
    try{var u=await sb.auth.getUser();userId=u&&u.data&&u.data.user?u.data.user.id:null;}catch(e){}
    var r=await sb.from('coupons').select('*, coupon_photos(storage_path,photo_type,display_order)').eq('id',id).single();
    if(r.error||!r.data){$('biz').textContent='Coupon nicht gefunden';return;}
    coupon=r.data;render();checkSaved();
    if(window.UGTrack&&coupon) UGTrack.track('coupon_view',{coupon_id:coupon.id});
    if(userId){try{var red=await sb.from('coupon_redemptions').select('id').eq('coupon_id',id).eq('user_id',userId).maybeSingle();if(red.data&&coupon.usage_limit_per_user===1){already=true;markDone();}}catch(e){}}
  }
  function render(){
    document.title=(coupon.title||'Coupon')+' — UniGoat';
    $('biz').textContent=(coupon.business_name||'')+(coupon.city?(' · '+coupon.city):'');
    $('title').textContent=coupon.title||'';
    $('desc').textContent=coupon.description||'';
    var dv=(coupon.discount_value||'').toString().trim(); if(/^\d+$/.test(dv))dv=dv+'%';
    $('badge').textContent=dv||'–';
    $('validDate').textContent=fmtDate(coupon.valid_until);
    // Kategorie-Badge (Restaurant / Laden / Supermarkt / Freizeit)
    var vl=venueLabel(coupon);
    if(vl){$('vbadge').textContent=vl;$('vbadge').style.display='inline-flex';}
    // Menue-Fotos (photo_type='menu') vorbereiten
    menuSlides=(coupon.coupon_photos||[])
      .filter(function(p){return p.photo_type==='menu';})
      .sort(function(a,b){return (a.display_order||0)-(b.display_order||0);})
      .map(function(p){return bucketUrl(p.storage_path);})
      .filter(Boolean);
    if(menuSlides.length || (coupon.description&&coupon.description.trim())){
      $('menuBtn').style.display='inline-flex';
    }
    // Optionaler Buchungslink des Partners (z. B. Online-Terminbuchung) — Einloesung bleibt vor Ort per QR
    if(coupon.booking_url){
      var bu=/^https?:/.test(coupon.booking_url)?coupon.booking_url:('https://'+coupon.booking_url);
      $('bookBtn').href=bu; $('bookBtn').style.display='inline-flex'; $('bookHint').style.display='block';
    }
    // Galerie: alle Fotos ausser logo
    var photos=(coupon.coupon_photos||[]).slice().sort(function(a,b){return (a.display_order||0)-(b.display_order||0);});
    var logo=photos.filter(function(p){return p.photo_type==='logo';})[0];
    var gal=photos.filter(function(p){return p.photo_type!=='logo';});
    if(!gal.length&&logo)gal=[logo];
    var g=$('gal'),d=$('dots');g.innerHTML='';d.innerHTML='';
    galUrls=gal.map(function(p){return bucketUrl(p.storage_path);});
    if(gal.length){gal.forEach(function(p,i){var im=document.createElement('img');im.src=galUrls[i];im.loading='lazy';im.style.cursor='zoom-in';im.onclick=function(){openLB(i);};g.appendChild(im);var dot=document.createElement('i');if(i===0)dot.className='on';d.appendChild(dot);});}
    else {g.style.background='var(--dark)';}
    if(gal.length>1){g.addEventListener('scroll',function(){var i=Math.round(g.scrollLeft/g.clientWidth);[].forEach.call(d.children,function(el,k){el.className=k===i?'on':'';});});} else {d.style.display='none';}
    if(logo){$('brand').innerHTML='<img src="'+bucketUrl(logo.storage_path)+'">';}else{$('brand').textContent=(coupon.business_name||'?').trim().slice(0,2).toUpperCase();}
    // Status + Schliesszeit (LIVE, aktualisiert jede Minute)
    var wt=weeklyText();
    if(wt){$('hoursRow').style.display='flex';$('hoursText').textContent=wt;}
    renderStatus();
    if(window.__statusTimer)clearInterval(window.__statusTimer);
    window.__statusTimer=setInterval(renderStatus,60000);
    // Action-Buttons (nur vorhandene)
    var acts=[];
    if(coupon.phone)acts.push('<a class="act" href="tel:'+coupon.phone+'"><span class="ic">'+IC.call+'</span>Anrufen</a>');
    if(coupon.address)acts.push('<a class="act" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(coupon.address+' '+(coupon.city||''))+'" target="_blank"><span class="ic">'+IC.map+'</span>Karte</a>');
    if(coupon.instagram){var h=coupon.instagram.replace('@','').replace(/^https?:\/\/(www\.)?instagram\.com\//,'');acts.push('<a class="act" href="https://instagram.com/'+h+'" target="_blank"><span class="ic ig">'+IC.ig+'</span>Instagram</a>');}
    if(coupon.website){var w=coupon.website.match(/^https?:/)?coupon.website:('https://'+coupon.website);acts.push('<a class="act" href="'+w+'" target="_blank"><span class="ic">'+IC.web+'</span>Website</a>');}
    var ac=$('actcard');ac.style.setProperty('--n',acts.length||1);ac.innerHTML=acts.join('')||'<div style="color:var(--mut);font-size:.85rem;padding:.4rem;text-align:center;grid-column:1/-1">Keine Kontaktdaten</div>';
  }
  function markDone(){var b=$('redeemBtn');b.textContent='Bereits eingelöst ✓';b.classList.add('gray');b.onclick=null;}

  // ---- Speichern / Favorit (saved_items, item_type='coupon') ----
  var saved=false;
  async function checkSaved(){
    if(!userId)return;
    try{var s=await sb.from('saved_items').select('id').eq('user_id',userId).eq('item_type','coupon').eq('item_id',String(id)).maybeSingle();saved=!!(s&&s.data);updateSaveUI();}catch(e){}
  }
  function updateSaveUI(){var b=$('saveBtn');if(!b)return;b.textContent=saved?'♥':'♡';b.classList.toggle('saved',saved);b.title=saved?'Gespeichert':'Speichern';}
  window.toggleSave=async function(){
    if(!userId){location.href='login.html';return;}
    saved=!saved;updateSaveUI(); // optimistisch
    try{
      if(saved){await sb.from('saved_items').insert({user_id:userId,item_type:'coupon',item_id:String(id)});}
      else{await sb.from('saved_items').delete().eq('user_id',userId).eq('item_type','coupon').eq('item_id',String(id));}
    }catch(e){saved=!saved;updateSaveUI();} // Rollback bei Fehler
  };

  // ---- Kategorie + Menue-/Angebots-Ansicht ----
  function venueLabel(c){
    var vt=(c.venue_type||'').toString().toLowerCase().trim();
    var map={restaurant:'🍽️ Restaurant',laden:'🛍️ Laden',shop:'🛍️ Laden',supermarkt:'🛒 Supermarkt',markt:'🛒 Supermarkt',freizeit:'🎉 Freizeitaktivität'};
    if(map[vt])return map[vt];
    var cat=(c.category||'').toString().toLowerCase();
    if(cat==='food')return '🍽️ Restaurant';
    if(cat==='beauty')return '💅 Beauty';
    if(cat==='service')return '🚗 Service';
    if(cat==='leisure')return '🎉 Freizeitaktivität';
    if(cat==='retail'||cat==='shop')return '🛍️ Laden';
    if(cat==='grocery')return '🛒 Supermarkt';
    return '';
  }
  window.openMenu=function(){
    var strip=$('menuStrip'),dots=$('menuDots');strip.innerHTML='';dots.innerHTML='';
    if(menuSlides.length){
      menuSlides.forEach(function(u,i){
        var s=document.createElement('div');s.className='mslide';
        var im=document.createElement('img');im.src=u;im.loading='lazy';s.appendChild(im);strip.appendChild(s);
        var dt=document.createElement('span');if(i===0)dt.className='on';dots.appendChild(dt);
      });
      if(menuSlides.length>1){strip.onscroll=function(){var i=Math.round(strip.scrollLeft/strip.clientWidth);[].forEach.call(dots.children,function(el,k){el.className=k===i?'on':'';});};}
    } else {
      var s=document.createElement('div');s.className='mslide';
      var box=document.createElement('div');box.className='mtext';
      var h=document.createElement('h3');h.textContent=venueLabel(coupon)||'Angebot';box.appendChild(h);
      var p=document.createElement('p');p.textContent=coupon.description||'Bald mehr Infos hier.';box.appendChild(p);
      s.appendChild(box);strip.appendChild(s);
    }
    $('menuOv').classList.add('open');
  };
  window.closeMenu=function(){$('menuOv').classList.remove('open');};

  // ---- Fullscreen-Bildergalerie ----
  window.openLB=function(startIdx){
    if(!galUrls.length)return;
    var strip=$('lbStrip');strip.innerHTML='';
    galUrls.forEach(function(u){var im=document.createElement('img');im.src=u;strip.appendChild(im);});
    $('lb').classList.add('open');
    // auf gewaehltes Bild springen (nach Layout)
    requestAnimationFrame(function(){strip.scrollLeft=startIdx*strip.clientWidth;updateLBCnt();});
    strip.onscroll=updateLBCnt;
  };
  function updateLBCnt(){var strip=$('lbStrip');var i=Math.round(strip.scrollLeft/strip.clientWidth);$('lbCnt').textContent=(galUrls.length>1)?((i+1)+' / '+galUrls.length):'';}
  window.closeLB=function(){$('lb').classList.remove('open');};

  // ---- Einloesen: Sicherheitsabfrage + Swipe-to-redeem ----
  function open(html){$('sheet').innerHTML=html;$('ov').classList.add('open');}
  window.closeSheet=function(){$('ov').classList.remove('open');};
  window.step1=function(){ // Gutschein-Ticket + Swipe-to-redeem
    if(already)return;
    var dv=(coupon.discount_value||'').toString();if(/^\d+$/.test(dv))dv=dv+'%';
    var validTxt=coupon.valid_until?('Gültig bis '+fmtDate(coupon.valid_until)):'';
    open('<h2 class="serif" style="text-align:center">Dein Gutschein</h2>'+
      '<div class="ticket">'+
        '<div class="ticket-top">'+
          '<div class="ticket-biz">'+escapeHtml(coupon.business_name||'')+'</div>'+
          '<div class="ticket-val serif">'+escapeHtml(dv||coupon.title||'')+'</div>'+
          '<div class="ticket-title">'+escapeHtml(coupon.title||'')+'</div>'+
          (validTxt?'<div class="ticket-valid">'+validTxt+'</div>':'')+
        '</div>'+
        '<div class="ticket-perf"></div>'+
        '<div class="ticket-bottom">'+
          '<div class="swipe" id="swipe"><div class="fill" id="swFill"></div><div class="lbl" id="swLbl">Zum Einlösen wischen <span class="chev"><svg viewBox="0 0 24 24"><path d="M8 6l6 6-6 6M13 6l6 6-6 6"/></svg></span></div><div class="knob" id="swKnob"><svg viewBox="0 0 24 24"><path d="M8 6l6 6-6 6M13 6l6 6-6 6"/></svg></div></div>'+
          '<div class="ticket-hint">⚠️ '+(coupon.usage_limit_per_user===1?'Einmalig — erst an der Kasse einlösen.':'Erst an der Kasse einlösen.')+'</div>'+
        '</div>'+
      '</div>'+
      '<button class="ghost" onclick="closeSheet()">Abbrechen</button>');
    mountSwipe();
  };
  function mountSwipe(){ // Slider: Knopf ganz nach rechts ziehen -> finish()
    var track=$('swipe'),knob=$('swKnob'),fill=$('swFill'),lbl=$('swLbl');
    var dragging=false,startX=0,x=0,max=0;
    function maxX(){return track.clientWidth-knob.offsetWidth-10;}
    function set(px){x=Math.max(0,Math.min(maxX(),px));knob.style.left=(5+x)+'px';fill.style.width=(knob.offsetWidth+10+x)+'px';lbl.style.opacity=String(1-x/maxX()*1.4);}
    function down(e){dragging=true;startX=(e.touches?e.touches[0].clientX:e.clientX)-x;knob.style.transition='none';fill.style.transition='none';}
    function move(e){if(!dragging)return;e.preventDefault();set((e.touches?e.touches[0].clientX:e.clientX)-startX);}
    function up(){if(!dragging)return;dragging=false;max=maxX();
      if(x>=max-4){ // vollstaendig gewischt -> einloesen
        track.classList.add('done');lbl.textContent='';set(max);
        knob.innerHTML='<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>';
        try{navigator.vibrate&&navigator.vibrate(30);}catch(e){}
        finish();
      } else { // zurueckschnappen
        knob.style.transition='left .18s';fill.style.transition='width .18s';set(0);
      }
    }
    knob.addEventListener('mousedown',down);knob.addEventListener('touchstart',down,{passive:false});
    document.addEventListener('mousemove',move);document.addEventListener('touchmove',move,{passive:false});
    document.addEventListener('mouseup',up);document.addEventListener('touchend',up);
  }
  var ERR_MSG={
    NOT_AUTHENTICATED:'Bitte logg dich ein, um einzulösen.',
    COUPON_NOT_FOUND:'Coupon nicht gefunden.',
    COUPON_INACTIVE:'Dieser Coupon ist nicht mehr aktiv.',
    COUPON_EXPIRED:'Dieser Coupon ist abgelaufen.',
    COUPON_MAX_REACHED:'Dieser Coupon ist leider ausgebucht.',
    ALREADY_REDEEMED:'Diesen Coupon hast du bereits eingelöst.',
    ALREADY_REDEEMED_TODAY:'Diesen Coupon hast du heute schon eingelöst — morgen wieder!',
    NOT_ENOUGH_COINS:'Dein erster Coupon heute war gratis. Für weitere brauchst du G-Coins — spiel Goat Blast und sammle welche!',
    GEO_REQUIRED:'Für diesen Coupon musst du vor Ort sein. Bitte erlaube den Standortzugriff und versuch es direkt beim Laden.',
    TOO_FAR:'Du bist noch nicht nah genug am Laden. Löse den Coupon direkt vor Ort ein.',
    QR_REQUIRED:'Bitte scanne den QR-Code am Tresen, um einzulösen.',
    QR_INVALID:'Dieser QR-Code passt nicht zu diesem Laden. Scanne den UniGoat-QR direkt beim Anbieter.'
  };
  function failSheet(msg){
    open('<div class="succ-ico" style="background:#ffe2e2;color:#d33">!</div>'+
      '<h2 class="serif" style="color:#d33">Klappt gerade nicht</h2>'+
      '<p>'+msg+'</p>'+
      '<button class="ghost" onclick="closeSheet()">Schließen</button>');
  }
  // Standort einmalig holen (nur zur Verifizierung; wird NICHT gespeichert). Verweigerung -> null.
  function getPos(){ return new Promise(function(resolve){
    if(!navigator.geolocation) return resolve(null);
    var done=false;
    navigator.geolocation.getCurrentPosition(
      function(p){ if(done)return; done=true; resolve({lat:p.coords.latitude,lng:p.coords.longitude}); },
      function(){ if(done)return; done=true; resolve(null); },
      { enableHighAccuracy:true, timeout:8000, maximumAge:60000 });
  }); }
  // Priming: EINMALIG erklaeren warum Standort, bevor der System-Dialog kommt (nur Geo-Coupons)
  function geoPriming(){
    return new Promise(function(resolve){
      try{ if(localStorage.getItem('ug_geo_primed')==='1'){ resolve(true); return; } }catch(e){}
      open('<div class="succ-ico" style="background:#eef6ff;color:#2563eb">📍</div>'+
        '<h2 class="serif">Kurz: dein Standort</h2>'+
        '<p>Damit wir dir die G-Coins gutschreiben können, prüfen wir <b>einmalig</b>, ob du gerade beim Laden bist. '+
        'Dein Standort wird <b>nicht gespeichert</b> – nur „bestätigt: ja/nein".</p>'+
        '<button class="btn" id="geoOk">Standort erlauben & einlösen</button>'+
        '<button class="ghost" id="geoLater" style="margin-top:8px">Abbrechen</button>');
      var ok=document.getElementById('geoOk'), later=document.getElementById('geoLater');
      if(ok) ok.onclick=function(){ try{localStorage.setItem('ug_geo_primed','1');}catch(e){} resolve(true); };
      if(later) later.onclick=function(){ resolve(null); };
    });
  }
  // Konfetti-Regen (Mint/Gold/Weiss) beim erfolgreichen Einloesen
  function fireConfetti(){ try{
    var cols=['#21D0A1','#12B489','#F4B740','#ffffff','#7CE9C9'];
    for(var i=0;i<34;i++){ var d=document.createElement('div'); d.className='confetti';
      d.style.left=(50+(Math.random()*44-22))+'vw'; d.style.background=cols[i%cols.length];
      d.style.setProperty('--dx',(Math.random()*180-90)+'px');
      d.style.setProperty('--dr',(Math.random()*720-360)+'deg');
      d.style.animationDelay=(Math.random()*0.18)+'s';
      if(i%3===0){ d.style.width='7px'; d.style.height='7px'; d.style.borderRadius='50%'; }
      document.body.appendChild(d);
      (function(el){ setTimeout(function(){ el.remove(); }, 2300); })(d);
    }
  }catch(e){} }
  // Zahl von 0 hochzaehlen (ease-out)
  function countUp(el,to){ if(!el)return; var s=performance.now(),dur=900;
    function step(t){ var p=Math.min(1,(t-s)/dur); el.textContent='+'+Math.round(to*(1-Math.pow(1-p,3))); if(p<1)requestAnimationFrame(step); }
    requestAnimationFrame(step);
  }
  window.finish=function(){ // Nach dem Swipe: QR-Code am Tresen scannen -> einloesen
    scanQrThenRedeem();
  };
  // ---- QR-Scanner (html5-qrcode, lazy geladen) ----
  function loadQrLib(){ return new Promise(function(res,rej){
    if(window.Html5Qrcode) return res();
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js';
    s.onload=function(){res();}; s.onerror=function(){rej(new Error('lib'));};
    document.head.appendChild(s);
  }); }
  var _qr=null;
  async function stopScanner(){ try{ if(_qr){ await _qr.stop(); try{_qr.clear();}catch(e){} _qr=null; } }catch(e){} }
  window.cancelScan=async function(){ await stopScanner(); closeSheet(); };
  async function scanQrThenRedeem(){
    open('<h2 class="serif" style="text-align:center">QR-Code scannen 📷</h2>'+
      '<p style="text-align:center;color:var(--text-muted);margin:.2rem 0 .8rem;">Scanne den UniGoat-QR am Tresen — das bestätigt, dass du vor Ort bist.</p>'+
      '<div id="qr-reader" style="width:100%;max-width:320px;margin:0 auto;border:2px solid var(--color-text,#201e1d);overflow:hidden;"></div>'+
      '<div id="qr-hint" style="text-align:center;color:var(--text-muted);font-size:13px;margin-top:.6rem;">Kamera wird gestartet…</div>'+
      '<button class="ghost" style="margin-top:.8rem" onclick="cancelScan()">Abbrechen</button>');
    try{ await loadQrLib(); }catch(e){ failSheet('QR-Scanner konnte nicht geladen werden. Bitte Internetverbindung prüfen und erneut versuchen.'); return; }
    try{
      _qr=new Html5Qrcode('qr-reader',{verbose:false});
      await _qr.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},
        async function(decoded){ await stopScanner(); doRedeem(decoded); },
        function(){/* ignore per-frame decode errors */});
      var h=document.getElementById('qr-hint'); if(h) h.textContent='Halte den QR-Code des Ladens in den Rahmen.';
    }catch(e){
      await stopScanner();
      failSheet('Kamerazugriff nicht möglich. Bitte erlaube die Kamera (Einstellungen → UniGoat → Kamera) und versuch es direkt beim Laden erneut.');
    }
  }
  async function doRedeem(token){ // Server-Redeem via self_redeem_qr
    open('<div class="succ-ico" style="background:#eafaf4;color:#0E9673">✓</div><h2 class="serif" style="text-align:center">Wird eingelöst…</h2>');
    var res;
    try{ res=await sb.rpc('self_redeem_qr',{p_coupon_id:coupon.id, p_token:String(token||'')}); }
    catch(e){ failSheet('Netzwerkfehler. Bitte nochmal versuchen.'); return; }
    var d=res&&res.data;
    if(res&&res.error){ failSheet('Serverfehler. Bitte nochmal versuchen.'); return; }
    if(!d||!d.ok){
      var em=ERR_MSG[d&&d.error]||'Einlösen nicht möglich.';
      failSheet(em); if((d&&d.error)==='ALREADY_REDEEMED'){already=true;markDone();} return; }
    var code=d.verification_code||'—';
    var earned=d.coins_earned||0;
    var coinBlock = (earned>0 ? '<div class="coinwin"><span class="ccoin">G</span><span class="cnum" id="coinCount">+0</span><span class="clbl">G-Coins</span></div>' : '');
    open('<div class="celebrate">'+
        '<div class="checkwrap"><svg class="checkmark" viewBox="0 0 52 52"><circle class="ck-ring" cx="26" cy="26" r="24"/><path class="ck-tick" d="M14 27l8 8 16-18"/></svg></div>'+
        '<h2 class="serif succ-h">Eingelöst! 🎉</h2>'+
        coinBlock +
        '<div class="stampbox"><span class="stamp-lbl">An der Kasse vorzeigen</span><b class="stamp-code">'+code+'</b><span class="stamp-ok">✓ gültig</span></div>'+
        '<p class="succ-p">Zeig der Kasse einfach diesen Screen.</p>'+
        '<button class="btn" onclick="closeSheet();'+(coupon.usage_limit_per_user===1?'location.reload()':'')+'">Fertig</button>'+
      '</div>');
    try{ if(navigator.vibrate) navigator.vibrate([18,40,28]); }catch(e){}
    fireConfetti();
    if(earned>0) countUp(document.getElementById('coinCount'), earned);
    if(coupon.usage_limit_per_user===1){already=true;markDone();}
    // Analytics erst nach erfolgreich gerendertem Erfolgs-Screen (nicht schon bei Server-Antwort)
    if(window.UGTrack&&coupon) UGTrack.track('coupon_redeemed',{coupon_id:coupon.id,coins:earned});
  }
  init();
})();
</script>

(function(){var n=0;(function w(){var s=(typeof sb!=='undefined'&&sb)||window.sb;
  if(s){try{verifyGate({blur:['.wrap'],message:'Verifiziere dich als Student, um diesen Coupon zu sehen und einzulösen.'});}catch(e){}return;}
  if(n++>60)return;setTimeout(w,100);})();})();
</script>
