<!DOCTYPE html>
<html lang="de">
<head>
    <script src="sentry-init.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Passwort vergessen - UniGoat</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico?v133">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v133">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v133">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v133">
  <link rel="stylesheet" href="unigoat-v2.css">
  <style>
    /* Alias-Tokens: mappt altes Vokabular auf v2, damit inline-styles/JS in v2-Farben laufen */
    :root{
      --ink:var(--color-text); --paper:var(--color-bg); --card:var(--color-surface);
      --w2:var(--color-neutral-300); --w4:var(--text-muted); --line:var(--color-divider);
      --green:var(--color-accent); --greenD:var(--accent-small); --greenL:var(--color-accent-100);
      --fh:var(--font-heading); --fb:var(--font-body);
    }

    main{ padding-bottom:8px; }

    /* Intro als Poster (der eine Mint-Moment) */
    .fp-intro{ background:var(--color-accent); color:var(--on-accent); padding:24px 20px 20px; }
    .fp-mark{ width:56px; height:56px; border:2px solid var(--on-accent); display:grid; place-items:center; margin-bottom:14px; }
    .fp-mark .icn{ width:28px; height:28px; stroke:var(--on-accent); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .fp-intro h2{ font-family:var(--font-heading); font-weight:800; font-size:26px; margin:0 0 8px; line-height:1.1; letter-spacing:-.02em; }
    .fp-intro p{ margin:0; font-size:14px; line-height:1.5; max-width:34ch; }

    /* Formular-Karte */
    .fp-card{ padding:18px 20px 16px; }
    .fp-card .field{ margin-bottom:14px; }

    /* Icon-Klasse fuer inline Lucide-SVG */
    .icn{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

    /* Erfolgs-Anzeige */
    .success-card{ display:none; text-align:center; padding:34px 20px; }
    .success-card .succ-mark{ width:64px; height:64px; margin:0 auto 16px; background:var(--color-accent); color:var(--on-accent); display:grid; place-items:center; }
    .success-card .succ-mark .icn{ width:34px; height:34px; stroke:var(--on-accent); fill:none; stroke-width:2.5; }
    .success-card h3{ font-family:var(--font-heading); font-weight:800; font-size:26px; margin:6px 0 10px; letter-spacing:-.02em; }
    .success-card p{ color:var(--text-muted); line-height:1.6; max-width:34ch; margin:0 auto 16px; }

    /* Zurueck-Link */
    .login-link{ padding:16px 20px 4px; text-align:center; font-family:var(--font-heading); font-weight:800; font-size:13px; }
    .login-link a{ color:var(--color-accent); text-decoration:none; }
  </style>
</head>
<body>

  <div class="screen">
    <div class="screen-body">
      <div class="topbar" style="padding-top:14px">
        <a class="btn btn-icon backbtn" href="login.html" style="margin-left:8px" aria-label="Zurück"><svg viewBox="0 0 24 24" style="width:22px;height:22px;stroke:var(--color-text);fill:none;stroke-width:2"><path d="M15 18l-6-6 6-6"/></svg></a>
        <div class="masthead" style="font-size:30px;padding:0 8px 0 2px">Passwort Reset</div>
        <span style="width:40px"></span>
      </div>
      <div class="hr"></div>

      <main>

        <div id="resetFormContainer">
          <section class="fp-intro">
            <div class="fp-mark">
              <svg class="icn" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="0"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <h2>Passwort vergessen?</h2>
            <p>Kein Problem! Gib deine E-Mail-Adresse ein und wir senden dir einen Link zum Zurücksetzen.</p>
          </section>

          <div class="fp-card">
            <form id="resetForm">
              <div class="field">
                <label for="resetEmail">E-Mail Adresse</label>
                <input class="input" type="email" id="resetEmail" required placeholder="deine@email.de">
              </div>
              <button type="submit" class="btn btn-primary btn-block" id="resetBtn">
                Link senden <span>→</span>
              </button>
            </form>
          </div>
        </div>

        <div id="successMessage" class="success-card">
          <div class="succ-mark">
            <svg class="icn" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="0"/><path d="m3 7 9 6 9-6"/></svg>
          </div>
          <h3>E-Mail gesendet!</h3>
          <p>Wir haben dir einen Link zum Zurücksetzen gesendet. Bitte prüfe deinen Posteingang (auch den Spam-Ordner).</p>
          <a href="login.html" class="btn btn-primary btn-block">Zurück zum Login</a>
        </div>

        <div class="login-link">
          <a href="login.html">← Zurück zum Login</a>
        </div>

      </main>
    </div>
  </div>

  <script src="lib/supabase.min.js"></script>
  <script src="config.js"></script>
<script src="translations.js"></script>
<script src="session-cache.js"></script>
  <script src="room8-ui.js"></script>
  <script>
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('resetForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var email = document.getElementById('resetEmail').value.trim();
        var btn = document.getElementById('resetBtn');

        if(!email) return;

        btn.disabled = true;
        btn.innerHTML = '<span style="opacity:0.8;">Sende...</span>';

        // Redirect URL zur Update-Passwort Seite - immer die Web-Domain nutzen
        var redirectUrl = 'https://unigoat.de/update-password.html';

        var { data, error } = await sb.auth.resetPasswordForEmail(email, {
            redirectTo: redirectUrl,
        });

        if (error) {
            console.error(error);
            Room8UI.error("Fehler: " + error.message);
            btn.disabled = false;
            btn.textContent = "Link senden";
        } else {
            document.getElementById('resetFormContainer').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
            document.querySelector('.login-link').style.display = 'none';
        }
    });
  </script>
</body>
</html>
