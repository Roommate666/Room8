<!DOCTYPE html>
<html lang="de" data-page="notifications">
<head>
<script src="sentry-init.js"></script>
<script src="features.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Benachrichtigungen — UniGoat</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v133">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="unigoat.css">
<style>
  .backbtn{background:none;border:none;cursor:pointer;display:flex;align-items:center;}
  .feed{display:flex;flex-direction:column;gap:8px;padding:0 2px;}
  .feeditem{background:var(--card,#fff);border-radius:14px;padding:12px 14px;box-shadow:0 2px 10px rgba(0,0,0,.04);}
  .feeditem .ft{font-weight:700;font-size:.92rem;}
  .feeditem .fb{color:var(--mut,#6b7a77);font-size:.85rem;margin-top:3px;line-height:1.45;}
  .feeditem .fm{font-size:.72rem;opacity:.55;margin-top:5px;}
  .feedtag{display:inline-block;font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:999px;margin-right:7px;vertical-align:middle;}
  .tag-game{background:rgba(33,208,161,.16);color:#12B489;}
  .tag-coupon{background:rgba(245,165,36,.16);color:#c77b00;}
  .tag-admin{background:rgba(99,102,241,.16);color:#6366f1;}
  .empty{text-align:center;color:var(--mut,#6b7a77);padding:50px 20px;}
</style>
</head>
<body class="ug">
<div class="ug-app">
  <div class="ug-hd">
    <a class="backbtn" href="einstellungen.html" aria-label="Zurück"><svg class="li" viewBox="0 0 24 24" style="width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.8"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div class="brand"><b>Benachrichtigungen</b></div>
    <span style="width:24px"></span>
  </div>
  <div class="feed" id="feed"><div class="feeditem"><div class="fb">Lade…</div></div></div>
</div>

<nav class="ugnav">
  <a href="dashboard.html"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1Z"/></svg>Hub</a>
  <a href="coupons.html"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>Coupons</a>
  <a href="game/index.html"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="3"/><path d="M8 12h3M9.5 10.5v3M15 11h.01M17 13h.01"/></svg>Game</a>
  <a href="challenge.html"><svg viewBox="0 0 24 24"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>Rang</a>
  <a href="profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>Profil</a>
</nav>

<script src="lib/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  function fmtWhen(ts){try{var d=new Date(ts),now=new Date(),diff=(now-d)/1000;
    if(diff<60)return 'gerade eben';
    if(diff<3600)return Math.floor(diff/60)+' Min';
    if(diff<86400)return Math.floor(diff/3600)+' Std';
    return d.toLocaleDateString('de-DE');}catch(e){return '';}}
  function tagFor(n){
    var t=((n.type||'')+' '+(n.title||'')+' '+(n.message||'')).toLowerCase();
    if(/rang|spiel|game|ueberhol|überhol|coin|goat|duell/.test(t))return ['tag-game','🎮 Spiel'];
    if(/coupon|deal|rabatt|shawarma|men[uü]|einl[oö]s|laden/.test(t))return ['tag-coupon','🎟️ Coupon'];
    return ['tag-admin','📢 Info'];
  }
  async function loadFeed(uid){
    var host=$('feed');
    try{
      var r=await sb.from('notifications').select('title,message,type,created_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(50);
      var rows=(r&&r.data)||[];
      host.innerHTML='';
      if(!rows.length){host.innerHTML='<div class="empty">🔔<br>Noch keine Benachrichtigungen.<br><small>Hier landen Spiel-Duelle, Coupon-Deals und Infos.</small></div>';return;}
      rows.forEach(function(n){
        var tag=tagFor(n);
        var it=document.createElement('div');it.className='feeditem';
        var t=document.createElement('div');t.className='ft';
        var tg=document.createElement('span');tg.className='feedtag '+tag[0];tg.textContent=tag[1];
        t.appendChild(tg);t.appendChild(document.createTextNode(n.title||''));
        var b=document.createElement('div');b.className='fb';b.textContent=n.message||'';
        var m=document.createElement('div');m.className='fm';m.textContent=fmtWhen(n.created_at);
        it.appendChild(t);it.appendChild(b);it.appendChild(m);host.appendChild(it);
      });
    }catch(e){host.innerHTML='<div class="empty">Benachrichtigungen konnten nicht geladen werden.</div>';}
  }
  async function init(){
    var s=await sb.auth.getUser();
    if(!s||!s.data||!s.data.user){location.href='login.html';return;}
    await loadFeed(s.data.user.id);
  }
  function boot(){if(window.sb)init();else setTimeout(boot,120);}
  boot();
})();
</script>
</body>
</html>
