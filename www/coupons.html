<!DOCTYPE html>
<html lang="de" data-page="coupons">
<head>
<script src="sentry-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Coupons — UniGoat</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v133">
<link rel="stylesheet" href="unigoat-v2.css">
<style>
  /* Alias: altes Token-Vokabular auf v2 (fuer inline var(--w4) etc.) */
  :root{
    --ink:var(--color-text); --paper:var(--color-bg); --card:var(--color-surface);
    --w2:var(--color-neutral-300); --w4:var(--text-muted); --line:var(--color-divider);
    --green:var(--color-accent); --greenD:var(--accent-small); --greenL:var(--color-accent-100);
    --fh:var(--font-heading); --fb:var(--font-body);
  }
  .icn{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:block; }
  .tab .icn{ width:20px; height:20px; margin-bottom:2px; }

  /* Header + Coins */
  .coins-pill{ display:inline-flex; align-items:center; gap:7px; border:2px solid var(--color-text); padding:6px 12px; font-family:var(--font-heading); font-weight:800; font-size:14px; text-decoration:none; color:var(--color-text); font-feature-settings:'tnum' 1; }

  /* Suche */
  .ug-search{ display:flex; align-items:center; gap:10px; background:var(--color-surface); border:1px solid var(--color-divider); padding:11px 14px; margin:14px 20px 0; }
  .ug-search input{ flex:1; min-width:0; border:none; background:none; font:inherit; font-size:16px; color:var(--color-text); outline:none; }
  .ug-search input::placeholder{ color:var(--text-muted); }
  .ug-search svg{ stroke:var(--text-muted); flex:none; }

  /* Kategorie-Chips (eckig, scrollbar) */
  .ug-chips{ display:flex; gap:0; overflow-x:auto; margin-top:14px; border-top:var(--rule); border-bottom:var(--rule); -webkit-overflow-scrolling:touch; }
  .ug-chip{ flex:none; background:none; border:0; border-right:var(--rule-thin); padding:12px 16px; font-family:var(--font-heading); font-weight:800; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); cursor:pointer; white-space:nowrap; }
  .ug-chip.on{ background:var(--color-text); color:var(--color-bg); }

  /* Partner-Banner -> dezente Notiz mit Akzent-Kante (kein knalliger Banner) */
  .ug-banner{ background:var(--color-surface); border-left:5px solid var(--color-accent); padding:14px 18px; margin:16px 20px; }
  .ug-banner h3{ font-family:var(--font-heading); font-weight:800; font-size:15px; margin:0 0 4px; }
  .ug-banner p{ font-size:13px; color:var(--text-muted); margin:0 0 10px; line-height:1.45; }
  .ug-banner .act{ display:inline-block; background:var(--color-accent); color:var(--on-accent); font-family:var(--font-heading); font-weight:800; font-size:13px; padding:9px 15px; text-decoration:none; }

  /* Coupon-Karten */
  #list{ padding:2px 0 16px; }
  .cpn{ display:block; text-decoration:none; color:var(--color-text); border-bottom:var(--rule); }
  .cpn .img{ position:relative; aspect-ratio:3 / 2; background-size:cover; background-position:center; background-color:var(--color-neutral-300); }
  .cpn .disc{ position:absolute; top:0; left:0; background:var(--color-accent); color:var(--on-accent); font-family:var(--font-heading); font-weight:800; font-size:19px; padding:4px 13px; letter-spacing:-.01em; }
  .cpn .openrow{ position:absolute; bottom:0; left:0; background:var(--color-text); color:var(--color-bg); font-family:var(--font-heading); font-size:11px; font-weight:800; letter-spacing:.04em; padding:5px 11px; display:flex; align-items:center; gap:6px; text-transform:uppercase; }
  .cpn .openrow .d{ width:7px; height:7px; background:var(--color-accent); display:inline-block; }
  .cpn .openrow.closed .d{ background:var(--text-muted); }
  .cpn .meta{ padding:12px 20px 15px; }
  .cpn .biz{ font-size:11px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
  .cpn .ti{ font-family:var(--font-heading); font-weight:800; font-size:18px; margin-top:4px; line-height:1.15; }
  .cpn .foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:11px; }
  .cpn .tag2{ font-family:var(--font-heading); font-weight:800; font-size:11px; background:var(--color-neutral-100); color:var(--color-neutral-800); padding:3px 10px; }
  .cpn .reward{ font-family:var(--font-heading); font-weight:800; font-size:11px; color:var(--accent-small); }

  /* Skeleton-Loader */
  .cpn-skel{ border-bottom:var(--rule); padding-bottom:15px; }
  .cpn-skel .sk{ background:linear-gradient(90deg,var(--color-surface) 25%,var(--color-neutral-200) 50%,var(--color-surface) 75%); background-size:200% 100%; animation:skho 1.3s ease-in-out infinite; }
  .cpn-skel .sk.img{ aspect-ratio:3 / 2; }
  .cpn-skel .sk.l1{ height:12px; margin:12px 20px 0; width:38%; }
  .cpn-skel .sk.l2{ height:18px; margin:9px 20px 0; width:72%; }
  .cpn-skel .sk.l3{ height:12px; margin:9px 20px 0; width:52%; }
  @keyframes skho{ 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  @media (prefers-reduced-motion: reduce){ .cpn-skel .sk{ animation:none; } }

  .ug-empty{ padding:44px 20px; text-align:center; color:var(--text-muted); font-size:14px; }
</style>
</head>
<body>
<div class="screen">
  <div class="screen-body">
    <div class="topbar" style="padding-top:14px">
      <div class="masthead" style="font-size:40px;padding:0 0 0 20px">Coupons</div>
      <a class="coins-pill" href="challenge.html" style="margin-right:12px"><i class="sq"></i> <span id="coins">–</span></a>
    </div>
    <div class="hr"></div>

    <div class="ug-search">
      <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke-width:2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Restaurant, Code, Stadt …" autocomplete="off">
    </div>

    <div class="ug-chips" id="chips">
      <button class="ug-chip on" data-cat="all">Alle</button>
      <button class="ug-chip" data-cat="food">Essen</button>
      <button class="ug-chip" data-cat="beauty">Beauty</button>
      <button class="ug-chip" data-cat="leisure">Freizeit</button>
      <button class="ug-chip" data-cat="service">Service</button>
      <button class="ug-chip" data-cat="fashion">Mode</button>
      <button class="ug-chip" data-cat="tech">Technik</button>
    </div>


    <div id="list">
      <div class="cpn-skel"><div class="sk img"></div><div class="sk l1"></div><div class="sk l2"></div><div class="sk l3"></div></div>
      <div class="cpn-skel"><div class="sk img"></div><div class="sk l1"></div><div class="sk l2"></div><div class="sk l3"></div></div>
      <div class="cpn-skel"><div class="sk img"></div><div class="sk l1"></div><div class="sk l2"></div><div class="sk l3"></div></div>
    </div>
  </div>

  <nav class="tabbar">
    <a class="tab" href="dashboard.html"><svg class="icn" viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1Z"/></svg>Hub</a>
    <a class="tab" href="coupons.html" aria-current="page"><svg class="icn" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="0"/><path d="M3 10h18"/></svg>Coupons</a>
    <a class="tab" href="game/index.html"><svg class="icn" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="0"/><path d="M8 12h3M9.5 10.5v3M15 11h.01M17 13h.01"/></svg>Game</a>
    <a class="tab" href="challenge.html"><svg class="icn" viewBox="0 0 24 24"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>Rang</a>
    <a class="tab" href="profile.html"><svg class="icn" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>Profil</a>
  </nav>
</div>

<script src="lib/supabase.min.js"></script>
<script src="config.js"></script>
<script src="onboarding-gate.js"></script>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  // width allein liefert bei Supabase ein verzerrtes Bild (Originalhoehe bleibt) -> height + resize:cover erzwingen (3:2)
  function bucketUrl(p,w){try{var o=w?{transform:{width:w,height:Math.round(w*2/3),resize:'cover',quality:76}}:undefined;return sb.storage.from('listing-images').getPublicUrl(p,o).data.publicUrl;}catch(e){return null;}}
  function fmtDisc(v){var s=(v||'').toString().trim();return /^\d+$/.test(s)?s+'%':s;}
  // Live-Oeffnungsstatus aus hours-JSON (Fallback opening_hours-Text)
  var DAYKEYS=['sun','mon','tue','wed','thu','fri','sat'];
  function hm(s){var m=/^(\d{1,2}):(\d{2})$/.exec(String(s).trim());return m?(+m[1])*60+(+m[2]):null;}
  function openState(c){
    var h=c.hours,valid=h&&typeof h==='object'&&DAYKEYS.some(function(k){return Array.isArray(h[k])&&h[k].length;});
    if(valid){
      var now=new Date(),dow=now.getDay(),nm=now.getHours()*60+now.getMinutes(),td=Array.isArray(h[DAYKEYS[dow]])?h[DAYKEYS[dow]]:[];
      for(var i=0;i<td.length;i++){var a=hm(td[i][0]),b=hm(td[i][1]);if(a!=null&&b!=null&&nm>=a&&nm<b)return{open:true,txt:'Geöffnet · bis '+td[i][1]};}
      for(var j=0;j<td.length;j++){var aa=hm(td[j][0]);if(aa!=null&&aa>nm)return{open:false,txt:'Öffnet '+td[j][0]};}
      return{open:false,txt:'Heute geschlossen'};
    }
    if(c.opening_hours){var mm=c.opening_hours.match(/(\d{1,2}[:.]\d{2})(?!.*\d{1,2}[:.]\d{2})/);return{open:true,txt:mm?('Geöffnet · bis '+mm[1].replace('.',':')):'Geöffnet'};}
    return null;
  }
  var all=[],cat='all',qs='';

  function render(){
    var rows=all.filter(function(c){
      var okc=cat==='all'||c.category===cat;
      var hay=((c.title||'')+' '+(c.business_name||'')+' '+(c.city||'')+' '+(c.discount_code||'')).toLowerCase();
      return okc && (!qs||hay.indexOf(qs)!==-1);
    });
    if(!rows.length){ $('list').innerHTML='<div class="ug-empty">Keine Coupons gefunden.</div>'; return; }
    $('list').innerHTML=rows.map(function(c){
      var st=openState(c);
      var openHtml=st?('<span class="openrow'+(st.open?'':' closed')+'"><span class="d"></span>'+esc(st.txt)+'</span>'):'';
      // Lazy: URL in data-bg, wird erst gesetzt wenn Kachel sichtbar (schneller Cold-Load, nur sichtbare Bilder laden sofort)
      var bg=c.imageUrl?('linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.35)),url(\''+encodeURI(c.imageUrl)+'\')'):'';
      // Bundle-Karte (Reseller mit mehreren Branchen-Angeboten) -> eigene Detailseite, zeigt Anzahl statt Rabatt
      if(c.is_bundle){
        var n=c.childCount||0;
        return '<a class="cpn" href="bundle-detail.html?id='+encodeURIComponent(c.id)+'">'+
          '<div class="img"'+(bg?' data-bg="'+bg+'"':'')+'>'+openHtml+'<span class="disc">'+n+' Angebote</span></div>'+
          '<div class="meta"><div class="biz">'+esc(c.business_name||'')+(c.city?' · '+esc(c.city):'')+'</div>'+
          '<div class="ti">'+esc(c.title||'')+'</div>'+
          '<div class="foot"><span class="tag2">'+n+' Branchen</span><span class="reward">Mehrere Rabatte</span></div></div></a>';
      }
      var usage=(c.usage_limit_per_user===1)?'1× pro Konto':'Mehrfach';
      return '<a class="cpn" href="coupon-detail.html?id='+encodeURIComponent(c.id)+'">'+
        '<div class="img"'+(bg?' data-bg="'+bg+'"':'')+'>'+openHtml+'<span class="disc">'+esc(fmtDisc(c.discount_value))+'</span></div>'+
        '<div class="meta"><div class="biz">'+esc(c.business_name||'')+(c.city?' · '+esc(c.city):'')+'</div>'+
        '<div class="ti">'+esc(c.title||'')+'</div>'+
        '<div class="foot"><span class="tag2">'+usage+'</span><span class="reward">+250 beim Einlösen</span></div></div></a>';
    }).join('');
    lazyBg();
  }
  function lazyBg(){ // background-images erst laden wenn Kachel (fast) sichtbar -> Cold-Load schneller
    var els=[].slice.call(document.querySelectorAll('#list .img[data-bg]'));
    if(!els.length)return;
    if(!('IntersectionObserver' in window)){ els.forEach(function(el){el.style.backgroundImage=el.getAttribute('data-bg');el.removeAttribute('data-bg');}); return; }
    var io=new IntersectionObserver(function(ents){ents.forEach(function(e){if(e.isIntersecting){var el=e.target;el.style.backgroundImage=el.getAttribute('data-bg');el.removeAttribute('data-bg');io.unobserve(el);}});},{rootMargin:'300px'});
    els.forEach(function(el){io.observe(el);});
  }

  async function load(){
    if(!window.sb){ $('list').innerHTML='<div class="ug-empty">Bitte einloggen.</div>'; return; }
    // Sofort aus Cache zeigen (stale-while-revalidate) -> Coupons erscheinen instant beim Wiederkommen
    try{ var cc=JSON.parse(localStorage.getItem('ug_coupons_cache3')||'null'); if(cc&&cc.length){ all=cc; render(); } }catch(e){}
    try{ var u=(await sb.auth.getUser()).data.user; if(u){ var pr=await sb.from('my_profile').select('coins').maybeSingle(); if(pr.data)$('coins').textContent=(pr.data.coins||0).toLocaleString('de-DE'); } }catch(e){}
    var heute=new Date().toISOString().slice(0,10);
    try{
      // Nur Spalten die die Liste braucht (KEINE lange description/Detailfelder -> kleinere Payload, schnellerer Cold-Load)
      var r=await sb.from('coupons').select('id,title,business_name,city,discount_value,discount_code,category,usage_limit_per_user,valid_until,max_redemptions,current_redemptions,opening_hours,created_at,parent_coupon_id,is_bundle, coupon_photos(storage_path,photo_type,display_order)').eq('status','active').order('created_at');
      var data=(r.data||[]).filter(function(c){ if(c.valid_until&&c.valid_until<heute)return false; if(c.max_redemptions!=null&&(c.current_redemptions||0)>=c.max_redemptions)return false; return true; });
      // Bundle-Kinder (parent_coupon_id gesetzt) erscheinen NICHT als eigene Karte -> pro Head zaehlen
      var childCount={};
      data.forEach(function(c){ if(c.parent_coupon_id){ childCount[c.parent_coupon_id]=(childCount[c.parent_coupon_id]||0)+1; } });
      var tops=data.filter(function(c){ return !c.parent_coupon_id; });
      all=tops.map(function(c){ var cov=(c.coupon_photos||[]).filter(function(p){return p.photo_type==='cover';})[0]||(c.coupon_photos||[])[0]; c.imageUrl=cov?bucketUrl(cov.storage_path,1000):null; c.childCount=childCount[c.id]||0; return c; });
      try{ localStorage.setItem('ug_coupons_cache3', JSON.stringify(all)); }catch(e){}
    }catch(e){ if(!all.length) all=[]; }
    render();
  }
  $('q').addEventListener('input',function(){qs=this.value.trim().toLowerCase();render();});
  $('chips').addEventListener('click',function(e){var b=e.target.closest('.ug-chip');if(!b)return;cat=b.getAttribute('data-cat');[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b);});render();});
  load();
})();
</script>
<script src="deeplink.js"></script>
<script src="events-tab.js"></script>
<script src="analytics.js"></script>
</body>
</html>
