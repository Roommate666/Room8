<!DOCTYPE html>
<html lang="de" data-page="admin-menu">
<head>
<script src="sentry-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menü-Fotos verwalten — UniGoat Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v133">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="unigoat.css">
<style>
  .amwrap{max-width:640px;margin:0 auto;padding:16px;}
  .amhd{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .amhd b{font-family:'Fraunces',serif;font-size:1.4rem;}
  .csel{width:100%;padding:14px;border-radius:14px;border:1px solid #d7e0de;font-size:1rem;background:#fff;margin-bottom:16px;}
  .mpanel{background:var(--card,#fff);border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.05);}
  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
  .mthumb{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#eef2f1;}
  .mthumb img{width:100%;height:100%;object-fit:cover;}
  .mthumb button{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(220,38,38,.92);color:#fff;font-weight:800;cursor:pointer;line-height:1;}
  .uparea{border:2px dashed #b9c7c3;border-radius:14px;padding:22px;text-align:center;color:var(--mut,#6b7a77);cursor:pointer;}
  .uparea input{display:none;}
  .btn-main{width:100%;background:var(--mint,#12B489);color:#04231a;border:none;border-radius:14px;padding:14px;font-weight:800;font-size:1rem;cursor:pointer;margin-top:12px;}
  .msg{text-align:center;padding:10px;font-weight:600;}
  .muted{color:var(--mut,#6b7a77);font-size:.85rem;}
</style>
</head>
<body class="ug">
<div class="amwrap">
  <div class="amhd"><a href="admin.html" style="text-decoration:none;font-size:1.4rem;">←</a><b>Menü-Fotos verwalten</b></div>
  <div id="gate" class="msg">Prüfe Zugriff…</div>
  <div id="app" style="display:none;">
    <select id="couponSel" class="csel"><option value="">— Coupon wählen —</option></select>
    <div id="panel" class="mpanel" style="display:none;">
      <div id="bizName" style="font-weight:700;margin-bottom:4px;"></div>
      <div class="muted">Lade Menü-/Angebots-Fotos hoch. Sie erscheinen swipebar auf der Coupon-Detailseite unter „Menü &amp; Angebot ansehen".</div>
      <div class="mgrid" id="mgrid"></div>
      <label class="uparea" id="uparea">
        📸 Fotos auswählen (mehrere möglich)
        <input type="file" id="fileInput" accept="image/*" multiple>
      </label>
      <div id="upmsg" class="msg"></div>
    </div>
  </div>
</div>

<script src="lib/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var curCoupon=null;
  function bucketUrl(path){try{return sb.storage.from('listing-images').getPublicUrl(path).data.publicUrl;}catch(e){return '';}}

  // Bild verkleinern (max 1600px Kante, JPEG) fuer schlanke Uploads
  function resize(file){
    return new Promise(function(resolve){
      var img=new Image();
      img.onload=function(){
        var max=1600,w=img.width,h=img.height;
        if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}
        var c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        c.toBlob(function(b){resolve(b||file);},'image/jpeg',0.85);
      };
      img.onerror=function(){resolve(file);};
      img.src=URL.createObjectURL(file);
    });
  }

  async function loadCoupons(){
    var r=await sb.from('coupons').select('id,title,business_name,city').eq('status','active').order('created_at',{ascending:false});
    var sel=$('couponSel');
    (r.data||[]).forEach(function(c){
      var o=document.createElement('option');o.value=c.id;
      o.textContent=(c.business_name||'?')+' — '+(c.title||'')+(c.city?(' ('+c.city+')'):'');
      sel.appendChild(o);
    });
  }

  async function loadMenu(couponId){
    var grid=$('mgrid');grid.innerHTML='';
    var r=await sb.from('coupon_photos').select('id,storage_path,display_order').eq('coupon_id',couponId).eq('photo_type','menu').order('display_order',{ascending:true});
    var rows=(r.data||[]);
    if(!rows.length){grid.innerHTML='<div class="muted" style="grid-column:1/-1">Noch keine Menü-Fotos.</div>';return;}
    rows.forEach(function(p){
      var d=document.createElement('div');d.className='mthumb';
      var im=document.createElement('img');im.src=bucketUrl(p.storage_path);d.appendChild(im);
      var b=document.createElement('button');b.textContent='×';b.title='Löschen';
      b.onclick=function(){delPhoto(p.id,p.storage_path);};
      d.appendChild(b);grid.appendChild(d);
    });
  }

  async function delPhoto(id,path){
    if(!confirm('Dieses Menü-Foto löschen?'))return;
    try{
      await sb.from('coupon_photos').delete().eq('id',id);
      try{await sb.storage.from('listing-images').remove([path]);}catch(e){}
      loadMenu(curCoupon);
    }catch(e){alert('Fehler beim Löschen: '+(e.message||e));}
  }

  async function uploadFiles(files){
    if(!curCoupon){return;}
    var msg=$('upmsg');
    // aktuellen Max-display_order holen
    var ex=await sb.from('coupon_photos').select('display_order').eq('coupon_id',curCoupon).eq('photo_type','menu').order('display_order',{ascending:false}).limit(1);
    var ord=(ex.data&&ex.data.length)?(ex.data[0].display_order||0)+1:0;
    var ok=0;
    for(var i=0;i<files.length;i++){
      msg.textContent='Lade '+(i+1)+' / '+files.length+' …';
      try{
        var blob=await resize(files[i]);
        var path='menu/'+curCoupon+'/'+Date.now()+'-'+i+'.jpg';
        var up=await sb.storage.from('listing-images').upload(path,blob,{contentType:'image/jpeg',upsert:true});
        if(up.error)throw up.error;
        var ins=await sb.from('coupon_photos').insert({coupon_id:curCoupon,storage_path:path,photo_type:'menu',display_order:ord+i});
        if(ins.error)throw ins.error;
        ok++;
      }catch(e){msg.textContent='Fehler: '+(e.message||e);}
    }
    msg.textContent=ok+' Foto(s) hochgeladen ✓';
    loadMenu(curCoupon);
    setTimeout(function(){msg.textContent='';},2500);
  }

  async function init(){
    var s=await sb.auth.getUser();
    if(!s||!s.data||!s.data.user){$('gate').textContent='Bitte einloggen.';location.href='login.html';return;}
    // Admin-Check ueber my_profile
    var adm=false;
    try{var p=await sb.from('my_profile').select('is_admin').maybeSingle();adm=!!(p.data&&p.data.is_admin);}catch(e){}
    if(!adm){$('gate').textContent='Kein Admin-Zugriff.';return;}
    $('gate').style.display='none';$('app').style.display='block';
    await loadCoupons();
    $('couponSel').addEventListener('change',function(){
      curCoupon=this.value||null;
      if(!curCoupon){$('panel').style.display='none';return;}
      $('bizName').textContent=this.options[this.selectedIndex].textContent;
      $('panel').style.display='block';loadMenu(curCoupon);
    });
    $('fileInput').addEventListener('change',function(){if(this.files&&this.files.length)uploadFiles(this.files);this.value='';});
  }
  function boot(){if(window.sb)init();else setTimeout(boot,120);}
  boot();
})();
</script>
</body>
</html>
