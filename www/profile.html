<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  function nf(n){return (n||0).toLocaleString('de-DE');}
  var ME=null;
  function openMyCard(){ if(!ME||!window.GoatAvatar)return; var bg=$('vkbg'); bg.innerHTML=GoatAvatar.renderVisitenkarte({username:ME.username,full_name:ME.full_name,city:ME.city,is_champion:ME.is_champion,coins:ME.coins,streak:ME.streak_days,avatar_config:ME.avatar_config}); bg.classList.add('show'); }
  // Streak-Retter (Freeze): Anzeige + Kauf (50 G-Coins, max 2)
  function renderFreezeRow(){ var el=$('freezeTxt'); if(!el||!ME)return; var f=ME.streak_freezes||0; el.textContent='Streak-Retter · '+f+'/2'+(f<2?' · gewinn im Spiel (alle 3 Daily-Quests)':' (voll)'); }
  async function buyFreeze(){
    if(!ME)return; if((ME.streak_freezes||0)>=2){ if(window.Room8UI&&Room8UI.info)Room8UI.info('Du hast schon 2 Streak-Retter.'); return; }
    if((ME.coins||0)<50){ if(window.Room8UI&&Room8UI.warning)Room8UI.warning('Du brauchst 50 G-Coins für einen Streak-Retter.'); return; }
    try{ var r=await sb.rpc('buy_streak_freeze'); if(r.error||!(r.data&&r.data.ok)) throw (r.error||new Error('fail'));
      ME.streak_freezes=r.data.freezes; ME.coins=r.data.coins; $('sCoins').textContent=nf(ME.coins); renderFreezeRow();
      if(window.Room8UI&&Room8UI.success)Room8UI.success('Streak-Retter gekauft! 🛡️');
    }catch(e){ if(window.Room8UI&&Room8UI.error)Room8UI.error('Kauf hat nicht geklappt.'); }
  }
  var TIERS=[['Bronze',0],['Silber',1000],['Gold',3000],['Platin',8000]];
  function tierInfo(c){var i=0;for(var k=0;k<TIERS.length;k++){if(c>=TIERS[k][1])i=k;}var cur=TIERS[i],next=TIERS[i+1];
    var pct=next?Math.min(100,Math.round((c-cur[1])/(next[1]-cur[1])*100)):100;
    return{cur:cur[0],next:next?next[0]:'MAX',pct:pct,toNext:next?(next[1]-c):0};}

  async function load(){
    if(!window.sb){ location.href='login.html'; return; }
    var u; try{u=(await sb.auth.getUser()).data.user;}catch(e){}
    if(!u){ location.href='login.html'; return; }
    var p={}; try{var r=await sb.from('my_profile').select('full_name,username,university,city,coins,streak_days,streak_freezes,is_student_verified,is_champion,avatar_config').maybeSingle(); if(r.data)p=r.data;}catch(e){}
    ME=p;
    renderFreezeRow();
    $('nm').textContent=(p.full_name||p.username||'Goat');
    $('un').textContent='@'+(p.username||'goat')+(p.university?' · '+p.university:'');
    $('sCoins').textContent=nf(p.coins); $('sStreak').textContent=(p.streak_days||0);
    try{ if(window.GoatAvatar) $('av').innerHTML=GoatAvatar.renderGoatAvatar(p.avatar_config||{},88); }catch(e){}
    var ti=tierInfo(p.coins||0);
    $('tierA').textContent=ti.cur.toUpperCase(); $('tierB').textContent=ti.next.toUpperCase(); $('tbar').style.width=ti.pct+'%';
    $('tnote').textContent=ti.toNext>0?('Noch '+nf(ti.toNext)+' G-Coins bis '+ti.next+' — schaltet neue Goat-Kostüme frei.'):'Höchstes Tier erreicht — alle Kostüme frei 🎉';
    if(p.is_student_verified){ $('verifyCh').textContent='Verifiziert ✓'; $('verifyCh').style.color='var(--green)'; }

    // Stats: eingeloeste Coupons + geworbene Freunde
    try{ var c=await sb.from('coupon_redemptions').select('id',{count:'exact',head:true}); $('sCoupons').textContent=(c.count||0); }catch(e){}
    try{ var f=await sb.from('coin_transactions').select('id',{count:'exact',head:true}).eq('reason','referral'); $('sFriends').textContent=(f.count||0); }catch(e){}

    // Freunde einladen -> Code holen + teilen
    $('inviteRow').addEventListener('click',async function(){
      try{
        var rr=await sb.rpc('ensure_referral_code'); var code=rr.data&&rr.data.code; if(!code)return;
        // Interim unigoat.pages.dev (unigoat.de haengt am netcup-Hold) -> spaeter zurueck auf unigoat.de
        var link='https://unigoat.de/register?ref='+code;
        if(navigator.share){ navigator.share({title:'UniGoat',text:'Komm auf UniGoat — Studentenrabatte, Games & G-Coins! 🐐',url:link}).catch(function(){}); }
        else { try{navigator.clipboard.writeText(link);}catch(e){} $('inviteCh').textContent='Link kopiert ✓'; }
      }catch(e){}
    });
  }
  $('logoutRow').addEventListener('click',async function(e){ e.preventDefault(); try{ localStorage.removeItem('ug_saved_email'); await sb.auth.signOut(); }catch(e){} location.href='login.html'; });
  // Visitenkarte oeffnen/schliessen
  var _cr=$('cardRow'); if(_cr) _cr.addEventListener('click',openMyCard);
  var _fr=$('freezeRow'); if(_fr) _fr.addEventListener('click',function(){ location.href='game/index.html'; });
  var _vk=$('vkbg'); if(_vk) _vk.addEventListener('click',function(e){ if(e.target===this||e.target.classList.contains('close')) this.classList.remove('show'); });
  load();
})();
</script>
