<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Goat Blast — UniGoat</title>
  <meta name="theme-color" content="#21D0A1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/tokens.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: var(--font); background: var(--bg); color: var(--ink);
      -webkit-user-select: none; user-select: none;
    }
    .app { display: flex; flex-direction: column; height: 100%;
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

    /* Kopfzeile: Wortmarke + Coins/Streak (Platzhalter fuer Retention-Kern) */
    .topbar { display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px 8px; }
    .brand { display: flex; align-items: baseline; gap: 2px; font-family: var(--font-display);
      font-weight: 700; font-size: 22px; letter-spacing: -.5px; }
    .brand .uni { color: var(--ink); }
    .brand .goat { color: var(--mint-700); }
    .stats { display: flex; gap: 8px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px;
      border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--line);
      font-weight: 700; font-size: 14px; box-shadow: var(--shadow-1); }
    .pill .n { font-family: var(--font-display); }

    /* Modus-Umschalter */
    .modes { display: flex; gap: 8px; padding: 4px 18px 6px; }
    .mode { flex: 1; height: 40px; border-radius: var(--r); border: 1px solid var(--line);
      background: var(--surface); color: var(--ink-2); font-weight: 700; font-size: 14px;
      display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
    .mode.active { background: var(--mint); color: var(--mint-ink); border-color: var(--mint); box-shadow: var(--shadow-mint); }
    .mode small { font-weight: 600; font-size: 11px; opacity: .7; }

    /* Spielflaeche */
    #game { flex: 1; width: 100%; position: relative; }
    #game canvas { display: block; margin: 0 auto; }

    .hint { text-align: center; color: var(--muted); font-size: 12.5px; padding: 4px 18px 10px; }
    .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-weight: 600; }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand"><span class="uni">Uni</span><span class="goat">Goat</span></div>
      <div class="stats">
        <span class="pill">🧀 <span class="n">0</span></span>
        <span class="pill">🔥 <span class="n">0</span></span>
      </div>
    </div>

    <div class="modes">
      <button class="mode active">Endlos</button>
      <button class="mode" title="Kommt in Phase 2">Daily Challenge <small>· bald</small></button>
    </div>

    <div id="game"><div class="loading">Goat Blast lädt…</div></div>
    <p class="hint">Tippe einen Käse-Block an, dann aufs Feld. Volle Reihe = weg. Der Goat feiert mit. 🐐</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script>
    // Ladehinweis entfernen sobald Phaser da ist
    document.querySelector('.mode:nth-child(2)').addEventListener('click', function () {
      alert('Daily Challenge (seeded, mit Leaderboard + Preisgeld) kommt in Phase 2.');
    });
    window.addEventListener('load', function () {
      var l = document.querySelector('.loading'); if (l) setTimeout(function(){ l.remove(); }, 400);
    });
  </script>
  <script src="goat-blast.js"></script>
</body>
</html>
