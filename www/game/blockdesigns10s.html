<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deep-3D scharf - UniGoat</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',system-ui,sans-serif;background:#eef1f4;color:#15202b;padding:16px 14px calc(40px + env(safe-area-inset-bottom));}
  h1{font-size:22px;font-weight:900;margin-bottom:4px;}
  .lead{font-size:13.5px;color:#5b6675;margin-bottom:18px;line-height:1.4;}
  .card{background:#f7f8fb;border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 3px 12px rgba(0,0,0,.06);}
  .ttl{font-size:16px;font-weight:900;margin-bottom:2px;}
  .desc{font-size:12px;color:#6b7684;margin-bottom:14px;}
  .row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .mini{--c:#2f6bff;display:grid;grid-template-columns:repeat(4,42px);grid-template-rows:repeat(4,42px);gap:4px;}
  .mini .e{background:rgba(150,165,185,.16);}
  .swatches{display:flex;gap:10px;}
  .sw{--c:#2f6bff;width:34px;height:34px;position:relative;}
  .f{position:relative;}

  /* A Scharf Basis (Radius 0) */
  .a .f,.a .sw{background:linear-gradient(150deg,color-mix(in srgb,var(--c) 55%,#fff 45%),var(--c) 42%,color-mix(in srgb,var(--c) 72%,#000 28%));box-shadow:inset 4px 4px 3px rgba(255,255,255,.55),inset -6px -8px 5px rgba(0,0,0,.4),0 6px 0 color-mix(in srgb,var(--c) 55%,#000 45%),0 9px 10px rgba(0,0,0,.3);}
  /* B Scharf Extra-tief */
  .b .f,.b .sw{background:linear-gradient(150deg,color-mix(in srgb,var(--c) 55%,#fff 45%),var(--c) 42%,color-mix(in srgb,var(--c) 72%,#000 28%));box-shadow:inset 4px 4px 3px rgba(255,255,255,.55),inset -6px -9px 6px rgba(0,0,0,.42),0 9px 0 color-mix(in srgb,var(--c) 52%,#000 48%),0 13px 12px rgba(0,0,0,.32);}
  /* C Scharf Matt */
  .c .f,.c .sw{background:linear-gradient(150deg,color-mix(in srgb,var(--c) 80%,#fff 20%),var(--c) 55%,color-mix(in srgb,var(--c) 78%,#000 22%));box-shadow:inset 0 2px 2px rgba(255,255,255,.28),inset -4px -6px 5px rgba(0,0,0,.34),0 6px 0 color-mix(in srgb,var(--c) 55%,#000 45%),0 9px 10px rgba(0,0,0,.3);}
  /* D Scharf Glanz-Band */
  .d .f,.d .sw{background:linear-gradient(150deg,color-mix(in srgb,var(--c) 55%,#fff 45%),var(--c) 42%,color-mix(in srgb,var(--c) 72%,#000 28%));box-shadow:inset 4px 4px 3px rgba(255,255,255,.55),inset -6px -8px 5px rgba(0,0,0,.4),0 6px 0 color-mix(in srgb,var(--c) 55%,#000 45%),0 9px 10px rgba(0,0,0,.3);}
  .d .f::before,.d .sw::before{content:"";position:absolute;left:8%;right:8%;top:7%;height:34%;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0));}
  /* E Scharf Rim-Light (heller Umriss) */
  .e2 .f,.e2 .sw{background:linear-gradient(150deg,color-mix(in srgb,var(--c) 55%,#fff 45%),var(--c) 42%,color-mix(in srgb,var(--c) 72%,#000 28%));box-shadow:inset 0 0 0 1.6px rgba(255,255,255,.65),inset 4px 4px 3px rgba(255,255,255,.5),inset -6px -8px 5px rgba(0,0,0,.4),0 6px 0 color-mix(in srgb,var(--c) 55%,#000 45%),0 9px 10px rgba(0,0,0,.3);}
  /* F Micro-Kante (Radius 4% - falls 0 zu hart) */
  .f2 .f,.f2 .sw{border-radius:8%;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 55%,#fff 45%),var(--c) 42%,color-mix(in srgb,var(--c) 72%,#000 28%));box-shadow:inset 4px 4px 3px rgba(255,255,255,.55),inset -6px -8px 5px rgba(0,0,0,.4),0 6px 0 color-mix(in srgb,var(--c) 55%,#000 45%),0 9px 10px rgba(0,0,0,.3);}
</style>
</head>
<body>
<h1>🧱 Deep-3D · scharfe Kanten</h1>
<p class="lead">Alle mit scharfen Ecken (Radius 0), nur F ist minimal entschaerft. Verschiedene Tiefe/Glanz. Sag mir den <b>Buchstaben</b> (A-F).</p>
<div id="app"></div>
<script>
var COLORS=['#2f6bff','#22b463','#ff8c1a','#ff5d8f','#e4483b','#f2b90c'];
var PATTERN=[1,1,0,1, 0,1,1,1, 1,0,0,1, 1,1,1,0];
var STYLES=[
  ['a','A · Scharf Basis','Scharfe Ecken, kraeftige Tiefe, heller Deckel.'],
  ['b','B · Scharf Extra-tief','Scharf + noch hoehere Wand, sehr wuchtig.'],
  ['c','C · Scharf Matt','Scharf, nur Tiefe, kein Glanz. Edel/hart.'],
  ['d','D · Scharf Glanz-Band','Scharf + breites Licht-Band oben.'],
  ['e2','E · Scharf Rim-Light','Scharf + feiner heller Umriss, "pops".'],
  ['f2','F · Micro-Kante','Nur 1px entschaerft — falls 0 zu hart wirkt.']
];
var app=document.getElementById('app');
STYLES.forEach(function(s){
  var card=document.createElement('div');card.className='card';
  card.innerHTML='<div class="ttl">'+s[1]+'</div><div class="desc">'+s[2]+'</div>';
  var row=document.createElement('div');row.className='row';
  var m=document.createElement('div');m.className='mini '+s[0];
  PATTERN.forEach(function(v){var c=document.createElement('div');c.className=v?'f':'e';m.appendChild(c);});
  row.appendChild(m);
  var sw=document.createElement('div');sw.className='swatches '+s[0];
  COLORS.forEach(function(col){var d=document.createElement('div');d.className='sw';d.style.setProperty('--c',col);sw.appendChild(d);});
  row.appendChild(sw);
  card.appendChild(row);app.appendChild(card);
});
</script>
</body>
</html>
