<!DOCTYPE html>
<html lang="de" data-page="events">
<head>
<script src="sentry-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Events — UniGoat</title>
<meta name="description" content="Partys, Workshops und Events für Studenten in deiner Unistadt — auf UniGoat.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v133">
<link rel="stylesheet" href="unigoat-v2.css">
<style>
  /* Alias: altes Token-Vokabular auf v2 (identisch zu coupons.html) */
  :root{
    --ink:var(--color-text); --paper:var(--color-bg); --card:var(--color-surface);
    --w2:var(--color-neutral-300); --w4:var(--text-muted); --line:var(--color-divider);
    --green:var(--color-accent); --greenD:var(--accent-small); --greenL:var(--color-accent-100);
    --fh:var(--font-heading); --fb:var(--font-body);
  }
  .icn{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:block; }
  .tab .icn{ width:20px; height:20px; margin-bottom:2px; }

  /* Suche (identisch zu coupons.html) */
  .ug-search{ display:flex; align-items:center; gap:10px; background:var(--color-surface); border:1px solid var(--color-divider); padding:11px 14px; margin:14px 20px 0; }
  .ug-search input{ flex:1; min-width:0; border:none; background:none; font:inherit; font-size:16px; color:var(--color-text); outline:none; }
  .ug-search input::placeholder{ color:var(--text-muted); }
  .ug-search svg{ stroke:var(--text-muted); flex:none; }

  /* Kategorie-Chips (identisch) */
  .ug-chips{ display:flex; gap:0; overflow-x:auto; margin-top:14px; border-top:var(--rule); border-bottom:var(--rule); -webkit-overflow-scrolling:touch; }
  .ug-chip{ flex:none; background:none; border:0; border-right:var(--rule-thin); padding:12px 16px; font-family:var(--font-heading); font-weight:800; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); cursor:pointer; white-space:nowrap; }
  .ug-chip.on{ background:var(--color-text); color:var(--color-bg); }

  /* Event-Karten — exakt die .cpn-Struktur von coupons.html */
  #list{ padding:2px 0 16px; }
  .cpn{ display:block; text-decoration:none; color:var(--color-text); border-bottom:var(--rule); }
  .cpn .img{ position:relative; aspect-ratio:3 / 2; background-size:cover; background-position:center; background-color:var(--color-neutral-300); }
  .cpn .disc{ position:absolute; top:0; left:0; background:var(--color-accent); color:var(--on-accent); font-family:var(--font-heading); font-weight:800; font-size:16px; padding:5px 13px; letter-spacing:-.01em; }
  .cpn .offc{ position:absolute; top:0; right:0; background:var(--color-text); color:var(--color-bg); font-family:var(--font-heading); font-weight:800; font-size:11px; padding:5px 11px; letter-spacing:.04em; text-transform:uppercase; }
  .cpn .openrow{ position:absolute; bottom:0; left:0; background:var(--color-text); color:var(--color-bg); font-family:var(--font-heading); font-size:11px; font-weight:800; letter-spacing:.04em; padding:5px 11px; display:flex; align-items:center; gap:6px; text-transform:uppercase; }
  .cpn .openrow .d{ width:7px; height:7px; background:var(--color-accent); display:inline-block; }
  .cpn .meta{ padding:12px 20px 15px; }
  .cpn .biz{ font-size:11px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
  .cpn .ti{ font-family:var(--font-heading); font-weight:800; font-size:18px; margin-top:4px; line-height:1.15; }
  .cpn .foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:11px; }
  .cpn .tag2{ font-family:var(--font-heading); font-weight:800; font-size:11px; background:var(--color-neutral-100); color:var(--color-neutral-800); padding:3px 10px; }
  .cpn .reward{ font-family:var(--font-heading); font-weight:800; font-size:11px; color:var(--accent-small); }

  /* Skeleton-Loader (identisch) */
  .cpn-skel{ border-bottom:var(--rule); padding-bottom:15px; }
  .cpn-skel .sk{ background:linear-gradient(90deg,var(--color-surface) 25%,var(--color-neutral-200) 50%,var(--color-surface) 75%); background-size:200% 100%; animation:skho 1.3s ease-in-out infinite; }
  .cpn-skel .sk.img{ aspect-ratio:3 / 2; }
  .cpn-skel .sk.l1{ height:12px; margin:12px 20px 0; width:38%; }
  .cpn-skel .sk.l2{ height:18px; margin:9px 20px 0; width:72%; }
  .cpn-skel .sk.l3{ height:12px; margin:9px 20px 0; width:52%; }
  @keyframes skho{ 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  @media (prefers-reduced-motion: reduce){ .cpn-skel .sk{ animation:none; } }

  .ug-empty{ padding:44px 20px; text-align:center; color:var(--text-muted); font-size:14px; }
</style>
</head>
<body>
<div class="screen">
  <div class="screen-body">
    <div class="topbar" style="padding-top:14px">
      <div class="masthead" style="font-size:40px;padding:0 0 0 20px">Events</div>
    </div>
    <div class="hr"></div>

    <div class="ug-search">
      <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke-width:2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Event, Ort, Veranstalter …" autocomplete="off">
    </div>

    <div class="ug-chips" id="chips">
      <button class="ug-chip on" data-cat="all">Alle</button>
      <button class="ug-chip" data-cat="party">Party</button>
      <button class="ug-chip" data-cat="lecture">Vortrag</button>
      <button class="ug-chip" data-cat="workshop">Workshop</button>
      <button class="ug-chip" data-cat="sport">Sport</button>
      <button class="ug-chip" data-cat="culture">Kultur</button>
      <button class="ug-chip" data-cat="networking">Networking</button>
      <button class="ug-chip" data-cat="food">Essen</button>
    </div>

    <div id="list">
      <div class="cpn-skel"><div class="sk img"></div><div class="sk l1"></div><div class="sk l2"></div><div class="sk l3"></div></div>
      <div class="cpn-skel"><div class="sk img"></div><div class="sk l1"></div><div class="sk l2"></div><div class="sk l3"></div></div>
      <div class="cpn-skel"><div class="sk img"></div><div class="sk l1"></div><div class="sk l2"></div><div class="sk l3"></div></div>
    </div>
  </div>

  <nav class="tabbar">
    <a class="tab" href="dashboard.html"><svg class="icn" viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1Z"/></svg>Hub</a>
    <a class="tab" href="coupons.html"><svg class="icn" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="0"/><path d="M3 10h18"/></svg>Coupons</a>
    <a class="tab" href="events.html" data-tab="events" aria-current="page"><svg class="icn" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="0"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>Events</a>
    <a class="tab" href="game/index.html"><svg class="icn" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="0"/><path d="M8 12h3M9.5 10.5v3M15 11h.01M17 13h.01"/></svg>Game</a>
    <a class="tab" href="challenge.html"><svg class="icn" viewBox="0 0 24 24"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>Rang</a>
    <a class="tab" href="profile.html"><svg class="icn" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>Profil</a>
  </nav>
</div>

<script src="lib/supabase.min.js"></script>
<script src="config.js"></script>
<script src="onboarding-gate.js"></script>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function bucketUrl(p,w){try{var o=w?{transform:{width:w,quality:60}}:undefined;return sb.storage.from('event-images').getPublicUrl(p,o).data.publicUrl;}catch(e){return null;}}

  var WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
  function p2(n){return (n<10?'0':'')+n;}
  function fmtDate(iso){ if(!iso) return {badge:'',time:''}; var d=new Date(iso);
    return { badge: WD[d.getDay()]+' '+p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.', time: p2(d.getHours())+':'+p2(d.getMinutes())+' Uhr' }; }
  function fmtPrice(p){ var n=Number(p); if(!n) return 'Eintritt frei'; return n.toLocaleString('de-DE')+' €'; }
  var CAT={party:'Party',lecture:'Vortrag',workshop:'Workshop',sport:'Sport',culture:'Kultur',networking:'Networking',food:'Essen',other:'Event'};

  var all=[],cat='all',qs='';

  function render(){
    var rows=all.filter(function(ev){
      var okc=cat==='all'||ev.category===cat;
      var hay=((ev.title||'')+' '+(ev.location||'')+' '+(ev.city||'')+' '+(ev.organizer_name||'')+' '+(ev.description||'')).toLowerCase();
      return okc && (!qs||hay.indexOf(qs)!==-1);
    });
    if(!rows.length){ $('list').innerHTML='<div class="ug-empty">Keine Events gefunden.</div>'; return; }
    $('list').innerHTML=rows.map(function(ev){
      var dt=fmtDate(ev.start_at);
      var bg=ev.imageUrl?('linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.35)),url(\''+encodeURI(ev.imageUrl)+'\')'):'';
      var off=ev.is_official?'<span class="offc">Offiziell</span>':'';
      var timeHtml=dt.time?('<span class="openrow"><span class="d"></span>'+esc(dt.time)+'</span>'):'';
      var going=ev.interest_count||0;
      var right = going>0 ? (going+(going===1?' geht hin':' gehen hin')) : fmtPrice(ev.price);
      var bizLine=(ev.organizer_name||'')+(ev.city?((ev.organizer_name?' · ':'')+ev.city):'');
      return '<a class="cpn" href="event-detail.html?id='+encodeURIComponent(ev.id)+'">'+
        '<div class="img"'+(bg?' data-bg="'+bg+'"':'')+'>'+timeHtml+'<span class="disc">'+esc(dt.badge)+'</span>'+off+'</div>'+
        '<div class="meta"><div class="biz">'+esc(bizLine)+'</div>'+
        '<div class="ti">'+esc(ev.title||'')+'</div>'+
        '<div class="foot"><span class="tag2">'+esc(CAT[ev.category]||'Event')+'</span><span class="reward">'+esc(right)+'</span></div></div></a>';
    }).join('');
    lazyBg();
  }
  function lazyBg(){
    var els=[].slice.call(document.querySelectorAll('#list .img[data-bg]'));
    if(!els.length)return;
    if(!('IntersectionObserver' in window)){ els.forEach(function(el){el.style.backgroundImage=el.getAttribute('data-bg');el.removeAttribute('data-bg');}); return; }
    var io=new IntersectionObserver(function(ents){ents.forEach(function(e){if(e.isIntersecting){var el=e.target;el.style.backgroundImage=el.getAttribute('data-bg');el.removeAttribute('data-bg');io.unobserve(el);}});},{rootMargin:'300px'});
    els.forEach(function(el){io.observe(el);});
  }

  async function load(){
    if(!window.sb){ $('list').innerHTML='<div class="ug-empty">Bitte einloggen.</div>'; return; }
    try{ var cc=JSON.parse(localStorage.getItem('ug_events_cache')||'null'); if(cc&&cc.length){ all=cc; render(); } }catch(e){}
    try{
      // status='active' + is_test=false (wie zuvor). Laufende Events bleiben sichtbar,
      // vergangene setzt der Cron auf 'past'. Nur Listen-Spalten -> schlanke Payload.
      var r=await sb.from('events').select('id,title,location,city,start_at,category,organizer_name,cover_image_path,price,interest_count,is_official')
        .eq('status','active').eq('is_test',false).order('start_at',{ascending:true}).limit(100);
      var data=(r.data||[]);
      all=data.map(function(ev){ ev.imageUrl=ev.cover_image_path?bucketUrl(ev.cover_image_path,400):null; return ev; });
      try{ localStorage.setItem('ug_events_cache', JSON.stringify(all)); }catch(e){}
    }catch(e){ if(!all.length) all=[]; }
    render();
  }
  $('q').addEventListener('input',function(){qs=this.value.trim().toLowerCase();render();});
  $('chips').addEventListener('click',function(e){var b=e.target.closest('.ug-chip');if(!b)return;cat=b.getAttribute('data-cat');[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b);});render();});
  load();
})();
</script>
<script src="deeplink.js"></script>
</body>
</html>
