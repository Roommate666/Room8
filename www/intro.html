<!DOCTYPE html>
<html lang="de">
<head>
<script src="sentry-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniGoat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#F7F4EE;color:#1A1613;font-family:'Fraunces',serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;overflow:hidden;}
  .mark{width:210px;height:210px;position:relative;}
  /* Logo erscheint via Reveal + leichtem Scale (wirkt wie gezeichnet) */
  .em{position:absolute;inset:0;background:center/contain no-repeat url('logo-goat.png?v90');
    clip-path:inset(0 100% 0 0);transform:scale(.92);opacity:0;
    animation:reveal 1.15s cubic-bezier(.6,.05,.3,1) .2s forwards;}
  @keyframes reveal{40%{opacity:1;}to{clip-path:inset(0 0 0 0);transform:scale(1);opacity:1;}}
  .word{font-size:40px;font-weight:600;letter-spacing:-.02em;opacity:0;transform:translateY(10px);
    animation:rise .6s ease 1.35s forwards;}
  @keyframes rise{to{opacity:1;transform:translateY(0);}}
  .tagline{font-family:'Sora',sans-serif;font-size:12.5px;color:#9C9284;font-weight:600;letter-spacing:.04em;
    opacity:0;animation:rise .6s ease 1.7s forwards;margin-top:-10px;}
  .skip{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));font-family:'Sora',sans-serif;font-size:12px;color:#9C9284;font-weight:600;background:none;border:none;cursor:pointer;}
  @media (prefers-reduced-motion: reduce){.em,.word,.tagline{animation-duration:.01ms;animation-delay:0s;}.em{clip-path:inset(0 0 0 0);opacity:1;transform:none;}.word,.tagline{opacity:1;transform:none;}}
</style>
</head>
<body>
  <div class="mark">
    <div class="em"></div>
  </div>
  <div class="word">UniGoat</div>
  <div class="tagline">Studenten-Deals · Games · Preise</div>
  <button class="skip" id="skip">überspringen</button>

<script src="lib/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
  "use strict";
  var done=false;
  async function go(){
    if(done) return; done=true;
    var next='login.html';
    try{
      if(window.sb){
        var r=await sb.auth.getSession();
        if(r&&r.data&&r.data.session){
          // "Angemeldet bleiben" war beim Login AUS -> beim App-Neustart abmelden
          if(localStorage.getItem('ug_persist')==='0'){
            try{ await sb.auth.signOut(); }catch(e){}
          } else {
            next='dashboard.html';
          }
        }
      }
    }catch(e){}
    location.replace(next);
  }
  document.getElementById('skip').addEventListener('click',go);
  document.body.addEventListener('click',function(e){ if(e.target.id!=='skip') { /* tap = weiter nach kurzer Zeit erlaubt */ } });
  setTimeout(go, 2600);
})();
</script>
</body>
</html>
